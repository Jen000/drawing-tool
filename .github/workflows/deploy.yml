# Publishes the game to GitHub Pages, filling in the Firebase config at build
# time so the values are not committed to the source.
#
# Set these under Settings → Secrets and variables → Actions. Secrets and
# Variables both work, and either naming is accepted:
#   DB_URL   or FIREBASE_DB_URL    https://yourproject-default-rtdb.firebaseio.com
#   API_KEY  or FIREBASE_API_KEY   AIzaSy…
#   DOCS_URL                       (optional) link shown in the app's Help panel
#
# IMPORTANT — this keeps the values out of the repository, NOT out of the
# published page. The browser has to know them to reach Firebase at all, so they
# end up in the HTML that Pages serves and anyone can read them with View
# Source. That is fine and expected: these values identify a project, they do
# not grant access to it. What decides who can host is the /hosts allowlist in
# firebase-rules.json. See docs/setup.md.
#
# Storing them as Secrets is harmless — it masks them in build logs, which is
# only cosmetic here — but do not mistake that masking for protection.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Inject Firebase config
        env:
          # Secrets or variables, under either naming — whichever you set is used.
          DB_URL:   ${{ secrets.DB_URL   || secrets.FIREBASE_DB_URL   || vars.DB_URL   || vars.FIREBASE_DB_URL }}
          API_KEY:  ${{ secrets.API_KEY  || secrets.FIREBASE_API_KEY  || vars.API_KEY  || vars.FIREBASE_API_KEY }}
          DOCS_URL: ${{ secrets.DOCS_URL || vars.DOCS_URL }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$API_KEY" ]; then
            echo "::error::Set DB_URL and API_KEY under Settings → Secrets and variables → Actions."
            echo "Either Secrets or Variables works; FIREBASE_DB_URL / FIREBASE_API_KEY are accepted too."
            exit 1
          fi

          python3 - <<'PY'
          import os, re, sys

          html = open('index.html', encoding='utf-8').read()
          block = re.search(r"const BUILT_IN = \{.*?\};", html, re.S)
          if not block:
              sys.exit("Could not find the BUILT_IN block in index.html")

          def js(value):
              return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

          replacement = (
              "const BUILT_IN = {\n"
              f"    dbUrl:  {js(os.environ['DB_URL'])},\n"
              f"    apiKey: {js(os.environ['API_KEY'])},\n"
              f"    docsUrl: {js(os.environ.get('DOCS_URL', ''))}\n"
              "  };"
          )
          open('index.html', 'w', encoding='utf-8').write(html[:block.start()] + replacement + html[block.end():])
          print("Injected Firebase config into index.html")
          PY

      - name: Check it actually landed
        run: |
          grep -q "firebaseio.com\|firebasedatabase.app" index.html \
            || { echo "::error::Config injection did not take"; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
