<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" role="img" aria-label="Three steps: the host puts a board on the screen, everyone draws the topic on their phone, the room votes and a winner is crowned">
  <style>
    .card { fill: #ffffff; stroke: #d8ddea; stroke-width: 2; }
    .screen { fill: #1a2136; }
    .ink { fill: #0f1729; font-family: 'Segoe UI', Inter, system-ui, sans-serif; font-weight: 600; font-size: 15px; }
    .muted { fill: #606b85; font-family: 'Segoe UI', Inter, system-ui, sans-serif; font-size: 12.5px; }
    .num { fill: #ffffff; font-family: 'Segoe UI', Inter, system-ui, sans-serif; font-weight: 700; font-size: 13px; }
    .chip { fill: #5b5bd6; }
    .arrow { stroke: #b9c0d4; stroke-width: 2; fill: none; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #171d2c; stroke: #2c344a; }
      .ink { fill: #eef1f8; }
      .muted { fill: #98a2ba; }
      .arrow { stroke: #414b66; }
    }
  </style>

  <!-- 1: board on the screen -->
  <g transform="translate(14,20)">
    <rect class="card" x="0" y="0" width="200" height="104" rx="12"/>
    <rect class="screen" x="18" y="16" width="164" height="72" rx="6"/>
    <rect x="30" y="28" width="70" height="9" rx="4.5" fill="#7c6cf0"/>
    <rect x="30" y="44" width="46" height="30" rx="4" fill="#ffffff" opacity=".92"/>
    <rect x="82" y="44" width="46" height="30" rx="4" fill="#ffffff" opacity=".72"/>
    <rect x="134" y="44" width="34" height="30" rx="4" fill="#ffffff" opacity=".5"/>
    <circle class="chip" cx="14" cy="14" r="11"/>
    <text class="num" x="14" y="18.5" text-anchor="middle">1</text>
  </g>
  <text class="ink" x="114" y="146" text-anchor="middle">Board goes up</text>
  <text class="muted" x="114" y="166" text-anchor="middle">code + QR on screen</text>

  <path class="arrow" d="M232 72 L252 72 M246 66 L252 72 L246 78"/>

  <!-- 2: drawing on a phone -->
  <g transform="translate(280,20)">
    <rect class="card" x="0" y="0" width="200" height="104" rx="12"/>
    <rect class="card" x="76" y="10" width="48" height="84" rx="8"/>
    <rect x="82" y="22" width="36" height="52" rx="4" fill="#ffffff" stroke="#e3e6f0"/>
    <path d="M88 62 Q100 34 112 62" fill="none" stroke="#e5484d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="88" cy="82" r="4" fill="#0f1729"/>
    <circle cx="100" cy="82" r="4" fill="#2f9e68"/>
    <circle cx="112" cy="82" r="4" fill="#f5a524"/>
    <circle class="chip" cx="14" cy="14" r="11"/>
    <text class="num" x="14" y="18.5" text-anchor="middle">2</text>
  </g>
  <text class="ink" x="380" y="146" text-anchor="middle">Everyone draws</text>
  <text class="muted" x="380" y="166" text-anchor="middle">no app, no login</text>

  <path class="arrow" d="M498 72 L518 72 M512 66 L518 72 L512 78"/>

  <!-- 3: vote + winner -->
  <g transform="translate(546,20)">
    <rect class="card" x="0" y="0" width="200" height="104" rx="12"/>
    <rect x="26" y="34" width="44" height="44" rx="6" fill="#ffffff" stroke="#f5a524" stroke-width="3"/>
    <path d="M36 62 Q48 40 60 62" fill="none" stroke="#5b5bd6" stroke-width="3" stroke-linecap="round"/>
    <text x="48" y="28" text-anchor="middle" font-size="16">👑</text>
    <rect x="84" y="34" width="40" height="44" rx="6" fill="#ffffff" stroke="#e3e6f0" stroke-width="2"/>
    <circle cx="104" cy="56" r="12" fill="none" stroke="#2f9e68" stroke-width="3"/>
    <rect x="136" y="34" width="40" height="44" rx="6" fill="#ffffff" stroke="#e3e6f0" stroke-width="2"/>
    <rect x="146" y="46" width="20" height="20" fill="none" stroke="#3ba3a3" stroke-width="3"/>
    <circle class="chip" cx="14" cy="14" r="11"/>
    <text class="num" x="14" y="18.5" text-anchor="middle">3</text>
  </g>
  <text class="ink" x="646" y="146" text-anchor="middle">Room votes</text>
  <text class="muted" x="646" y="166" text-anchor="middle">winner on the big screen</text>
</svg>
