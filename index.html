          <p>${esc(why)}</p>
        </div>
      </div>`;
  }

  async function drawPollLoop(){
    const state = await getState();
    noteState(state);

    /* Rules refuse reads outside the host's session window. */
    if(readDenied){
      renderClosedScreen();
      drawLastPhase = null; drawLastRound = null;
      setTimeout(drawPollLoop, POLL_MS);
      return;
    }
    closedShown = false;

    const roundChanged = state.round !== drawLastRound;
    if(state.phase !== drawLastPhase || roundChanged){
      drawLastPhase = state.phase;
      drawLastRound = state.round;
      if(roundChanged) resetBoardCache();
      if(state.phase === 'drawing') renderDrawingPhase(state);
      else if(state.phase === 'voting') await renderVotingPhase(state);
      else if(state.phase === 'results') await renderResultsPhase(state);
    } else if(state.phase === 'drawing'){
      /* Update in place — re-rendering here would wipe the drawing in progress. */
      updateDrawTimer(state);
      updateDrawTopic(state);
    } else if(state.phase === 'voting'){
      await renderVotingPhase(state);
    } else if(state.phase === 'results'){
      await renderResultsPhase(state);
    }
    setTimeout(drawPollLoop, POLL_MS);
  }

  function topicText(state){ return state.topic || 'Draw whatever comes to mind!'; }

  function updateDrawTopic(state){
    const el = document.querySelector('.topic-text');
    if(el && el.textContent !== topicText(state)) el.textContent = topicText(state);
  }

  /* Polls arrive every few seconds and at uneven times, so a timer painted by
     the poll skips and stutters. The deadline is an absolute timestamp, so the
     poll only has to keep it fresh — a local ticker does the counting. */
  let latestState = null;
  function noteState(state){ latestState = state; paintTimers(); }

  function timerRemaining(){
    const s = latestState;
    if(!s || s.phase !== 'drawing') return null;
    if(s.timerEnd) return s.timerEnd - serverNow();
    if(typeof s.timerPausedAt === 'number') return s.timerPausedAt;   /* frozen */
    return null;
  }
  function timerIsPaused(){
    const s = latestState;
    return !!(s && s.phase === 'drawing' && !s.timerEnd && typeof s.timerPausedAt === 'number');
  }

  function paintTimers(){
    const remaining = timerRemaining();
    const paused = timerIsPaused();
    const low = remaining != null && !paused && remaining < 15000;
    const face = remaining == null ? '' : (paused ? '⏸ ' : '') + fmtTime(remaining);

    const pill = document.getElementById('drawTimerPill');
    if(pill){
      pill.style.display = remaining == null ? 'none' : 'inline-block';
      if(remaining != null){
        pill.textContent = paused ? face : '⏱ ' + fmtTime(remaining);
        pill.classList.toggle('low', low);
      }
    }
    const host = document.getElementById('hostTimer');
    if(host){
      host.textContent = face;
      host.style.color = low ? 'var(--danger)' : '';
      host.style.opacity = paused ? '.6' : '';
    }
    const screen = document.getElementById('screenTimer');
    if(screen){
      screen.style.display = remaining == null ? 'none' : '';
      if(remaining != null){
        screen.textContent = face;
        screen.classList.toggle('low', low);
      }
    }
    const pauseBtn = document.getElementById('pauseTimerBtn');
    if(pauseBtn){
      const has = remaining != null;
      pauseBtn.textContent = paused ? 'Resume' : 'Pause';
      pauseBtn.disabled = !has;
      const clearBtn = document.getElementById('clearTimerBtn');
      if(clearBtn) clearBtn.disabled = !has;
      const startBtn = document.getElementById('startTimerBtn');
      if(startBtn) startBtn.textContent = has ? 'Restart timer' : 'Start timer';
    }
  }
  /* Four ticks a second, so the displayed second turns over on time. */
  setInterval(paintTimers, 250);

  function updateDrawTimer(state){ noteState(state); }

  function starPath(ctx, cx, cy, outerR, innerR){
    const spikes = 5;
    let rot = Math.PI/2*3;
    const step = Math.PI/spikes;
    ctx.moveTo(cx, cy - outerR);
    for(let i=0;i<spikes;i++){
      let x = cx + Math.cos(rot)*outerR, y = cy + Math.sin(rot)*outerR;
      ctx.lineTo(x,y); rot += step;
      x = cx + Math.cos(rot)*innerR; y = cy + Math.sin(rot)*innerR;
      ctx.lineTo(x,y); rot += step;
    }
    ctx.lineTo(cx, cy - outerR);
    ctx.closePath();
  }

  function drawShape(ctx, mode, x0, y0, x1, y1, color, lineWidth, filled){
    const x = Math.min(x0,x1), y = Math.min(y0,y1), w = Math.abs(x1-x0), h = Math.abs(y1-y0);
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lineWidth;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    if(mode === 'line'){ ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); return; }
    if(mode === 'rect'){ ctx.rect(x,y,w,h); }
    else if(mode === 'circle'){ ctx.ellipse(x+w/2, y+h/2, Math.max(w/2,1), Math.max(h/2,1), 0, 0, Math.PI*2); }
    else if(mode === 'triangle'){ ctx.moveTo(x+w/2,y); ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h); ctx.closePath(); }
    else if(mode === 'star'){ starPath(ctx, x+w/2, y+h/2, Math.max(Math.min(w,h)/2,1), Math.max(Math.min(w,h)/4,1)); }
    if(filled) ctx.fill();
    ctx.stroke();
  }

  function renderDrawingPhase(state){
    const inner = document.getElementById('drawInner');
    inner.innerHTML = `
      <div class="draw-shell">
        <div class="db-top">
          <div style="min-width:0;">
            <span class="eyebrow">Topic</span>
            <div class="topic-text">${esc(topicText(state))}</div>
          </div>
          <div class="timer-pill" id="drawTimerPill" style="display:none;"></div>
        </div>
        <div class="canvas-area" id="canvasArea">
          <div class="canvas-viewport" id="canvasViewport">
            <div class="canvas-stage" id="canvasStage">
              <canvas id="canvas"></canvas>
              <canvas id="overlay"></canvas>
            </div>
            <div class="zoom-pill" id="zoomPill">100%</div>
          </div>
        </div>
        <div class="db-toolbar">
          <div class="tool-row" id="recentRow" style="display:none;">
            <span class="tool-label">Recent</span>
            <div class="recent-swatches" id="recentSwatches"></div>
          </div>
          <div class="tool-row" id="colorRow"></div>
          <div class="tool-row" id="modeRow"></div>
        </div>
        <div class="db-bottom">
          <input id="nameInput" class="field" type="text" maxlength="24" placeholder="Your name (optional)">
          <button class="btn secondary" id="clearBtn">Clear</button>
          <button class="btn" id="submitBtn">Add</button>
        </div>
      </div>
    `;
    updateDrawTimer(state);

    const area = document.getElementById('canvasArea');
    const viewport = document.getElementById('canvasViewport');
    const stage = document.getElementById('canvasStage');
    const canvas = document.getElementById('canvas');
    const overlay = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const octx = overlay.getContext('2d');

    /* Backing store is created once at a fixed size and left alone forever. */
    [canvas, overlay].forEach(c=>{ c.width = CANVAS_SIZE; c.height = CANVAS_SIZE; });
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    /* ---- zoom & pan ----
       The bitmap never changes; only how much of it you are looking at. Because
       pointer positions are mapped through getBoundingClientRect, which already
       accounts for the CSS transform, drawing stays pixel-accurate at any zoom. */
    const MIN_ZOOM = 1, MAX_ZOOM = 8;
    let zoom = 1, panX = 0, panY = 0, viewSize = 280;
    let zoomPillTimer = null;

    function clampPan(){
      const min = viewSize * (1 - zoom);
      panX = Math.min(0, Math.max(min, panX));
      panY = Math.min(0, Math.max(min, panY));
    }
    function applyView(){
      stage.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
      const pill = document.getElementById('zoomPill');
      if(pill){
        pill.textContent = Math.round(zoom * 100) + '%';
        pill.classList.toggle('show', zoom > 1.01);
      }
      const out = document.getElementById('zoomOutBtn');
      const inn = document.getElementById('zoomInBtn');
      if(out) out.classList.toggle('disabled', zoom <= MIN_ZOOM + 0.001);
      if(inn) inn.classList.toggle('disabled', zoom >= MAX_ZOOM - 0.001);
    }
    /* Keep the point under the fingers (or cursor) pinned while scaling. */
    function zoomAt(nextZoom, fx, fy){
      const z = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, nextZoom));
      if(Math.abs(z - zoom) < 0.0005) return;
      panX = fx - (fx - panX) * (z / zoom);
      panY = fy - (fy - panY) * (z / zoom);
      zoom = z;
      clampPan();
      applyView();
    }
    function resetView(){ zoom = 1; panX = 0; panY = 0; applyView(); }
    function viewportPoint(e){
      const r = viewport.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    viewport.addEventListener('wheel', (e)=>{
      e.preventDefault();
      const p = viewportPoint(e);
      const factor = Math.exp(-e.deltaY * 0.0015);
      zoomAt(zoom * factor, p.x, p.y);
    }, { passive:false });

    /* Only the CSS box changes when the viewport moves — pixels are never rescaled. */
    function layoutStage(){
      const cs = getComputedStyle(area);
      const availW = area.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const availH = area.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      const size = Math.max(80, Math.floor(Math.min(availW, availH)));
      viewport.style.width = size + 'px';
      viewport.style.height = size + 'px';
      viewSize = size;
      clampPan();
      applyView();
    }
    layoutStage();
    window.addEventListener('resize', layoutStage);
    window.addEventListener('orientationchange', layoutStage);
    if(window.visualViewport) window.visualViewport.addEventListener('resize', layoutStage);
    if(window.ResizeObserver) new ResizeObserver(layoutStage).observe(area);

    const colors = ['#0f1729','#ffffff','#e5484d','#f76b15','#f5a524','#ecd94a','#5fae5f','#2f9e68','#3ba3a3','#3b5a8a','#5b5bd6','#c15a9e','#8a5a3c'];
    let currentColor = colors[0];
    const colorRow = document.getElementById('colorRow');

    /* The three colours this person reached for most recently, kept for the
       length of the session so they don't hunt through the palette again. */
    const RECENT_KEY = 'drawTopicRecent:' + (boardId || 'default');
    const RECENT_MAX = 3;
    let recentColors = [];
    try{
      const raw = localStorage.getItem(RECENT_KEY);
      if(raw) recentColors = (JSON.parse(raw) || []).filter(c=>/^#[0-9a-f]{6}$/i.test(c)).slice(0, RECENT_MAX);
    }catch(e){ recentColors = []; }

    function noteRecentColor(c){
      const norm = String(c).toLowerCase();
      recentColors = [norm, ...recentColors.filter(x=>x !== norm)].slice(0, RECENT_MAX);
      try{ localStorage.setItem(RECENT_KEY, JSON.stringify(recentColors)); }catch(e){}
      paintRecent();
    }
    function paintRecent(){
      const row = document.getElementById('recentRow');
      const wrap = document.getElementById('recentSwatches');
      if(!row || !wrap) return;
      if(!recentColors.length){ row.style.display = 'none'; return; }
      row.style.display = '';
      wrap.innerHTML = '';
      recentColors.forEach(c=>{
        const s = document.createElement('button');
        s.type = 'button';
        s.className = 'swatch' + (c === String(currentColor).toLowerCase() ? ' active' : '');
        s.style.background = c;
        s.setAttribute('aria-label', 'Recent colour ' + c);
        s.addEventListener('click', ()=>{ pickColor(c); });
        wrap.appendChild(s);
      });
    }
    /* One place every colour choice goes through, so recents stay honest. */
    function pickColor(c, opts){
      currentColor = c;
      [...colorRow.querySelectorAll('.swatch')].forEach(el=>{
        el.classList.toggle('active', el.dataset.color === String(c).toLowerCase());
      });
      if(currentMode === 'eraser') setMode('pen');
      if(!opts || opts.remember !== false) noteRecentColor(c);
      else paintRecent();
    }
    colors.forEach((c,i)=>{
      const s = document.createElement('button');
      s.type = 'button';
      s.className = 'swatch' + (i===0 ? ' active' : '');
      s.style.background = c;
      s.dataset.color = c.toLowerCase();
      s.setAttribute('aria-label', 'Colour ' + c);
      s.addEventListener('click', ()=> pickColor(c));
      colorRow.appendChild(s);
    });
    const pickerWrap = document.createElement('div');
    pickerWrap.className = 'color-picker-wrap';
    pickerWrap.innerHTML = `<input type="color" id="customColor" value="#0f1729" aria-label="Custom colour">`;
    colorRow.appendChild(pickerWrap);
    /* 'input' fires all through the drag, so only record once it settles. */
    document.getElementById('customColor').addEventListener('input', (e)=> pickColor(e.target.value, {remember:false}));
    document.getElementById('customColor').addEventListener('change', (e)=> pickColor(e.target.value));

    const modeRow = document.getElementById('modeRow');
    const modes = [
      {id:'pen', label:'✏️ Pen'},
      {id:'eraser', label:'🧽 Eraser'},
      {id:'grab', label:'✋ Move'},
      {id:'line', label:'／ Line'},
      {id:'rect', label:'▭ Rect'},
      {id:'circle', label:'◯ Circle'},
      {id:'triangle', label:'△ Triangle'},
      {id:'star', label:'★ Star'}
    ];
    let currentMode = 'pen';
    const modeBtns = {};
    modes.forEach((m,i)=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tool-btn' + (i===0 ? ' active' : '');
      b.textContent = m.label;
      b.addEventListener('click', ()=> setMode(m.id));
      modeBtns[m.id] = b;
      modeRow.appendChild(b);
    });
    modeRow.appendChild(Object.assign(document.createElement('div'), {className:'divider'}));

    let fillMode = false;
    const fillBtn = document.createElement('button');
    fillBtn.type = 'button';
    fillBtn.className = 'tool-btn';
    fillBtn.textContent = '⬛ Fill';
    fillBtn.addEventListener('click', ()=>{ fillMode = !fillMode; fillBtn.classList.toggle('active', fillMode); });
    modeRow.appendChild(fillBtn);
    modeRow.appendChild(Object.assign(document.createElement('div'), {className:'divider'}));

    function setMode(id){
      currentMode = id;
      Object.keys(modeBtns).forEach(k=> modeBtns[k].classList.toggle('active', k === id));
      /* Fill only applies to closed shapes. */
      const fillable = ['rect','circle','triangle','star'].includes(id);
      fillBtn.classList.toggle('disabled', !fillable);
      viewport.style.cursor = id === 'grab' ? 'grab' : 'crosshair';
    }
    setMode('pen');

    const sizes = [3,8,18];
    let currentSize = sizes[1];
    sizes.forEach((sz,i)=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'size-btn' + (i===1 ? ' active' : '');
      b.setAttribute('aria-label', 'Brush size ' + sz);
      b.innerHTML = `<span style="width:${Math.round(sz*0.8)}px;height:${Math.round(sz*0.8)}px;"></span>`;
      b.addEventListener('click', ()=>{
        currentSize = sz;
        [...modeRow.querySelectorAll('.size-btn')].forEach(el=>el.classList.remove('active'));
        b.classList.add('active');
      });
      modeRow.appendChild(b);
    });

    modeRow.appendChild(Object.assign(document.createElement('div'), {className:'divider'}));
    [
      { id:'zoomOutBtn', label:'−', title:'Zoom out', act:()=> zoomAt(zoom / 1.4, viewSize/2, viewSize/2) },
      { id:'zoomFitBtn', label:'⤢', title:'Fit the whole canvas', act:()=> resetView() },
      { id:'zoomInBtn',  label:'+', title:'Zoom in', act:()=> zoomAt(zoom * 1.4, viewSize/2, viewSize/2) }
    ].forEach(z=>{
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tool-btn zoom-btn';
      btn.id = z.id;
      btn.textContent = z.label;
      btn.title = z.title;
      btn.setAttribute('aria-label', z.title);
      btn.addEventListener('click', z.act);
      modeRow.appendChild(btn);
    });
    applyView();

    paintRecent();

    /* Canvas pixels are 1200×1200 regardless of how big the stage is on screen. */
    function strokeWidth(){ return currentMode === 'eraser' ? currentSize * 3 : currentSize; }
    function strokeColor(){ return currentMode === 'eraser' ? '#ffffff' : currentColor; }

    let hasDrawn = false;
    let drawing = false, activePointer = null, startX = 0, startY = 0, lastX = 0, lastY = 0;

    /* Two fingers always pan and zoom, whichever tool is selected — the grab
       tool is there for a mouse, and for one-finger panning. */
    const pointers = new Map();
    let gesture = null;

    function pos(e){
      const rect = overlay.getBoundingClientRect();
      const sx = CANVAS_SIZE / rect.width;
      const sy = CANVAS_SIZE / rect.height;
      return { x:(e.clientX - rect.left) * sx, y:(e.clientY - rect.top) * sy };
    }
    function cancelStroke(){
      if(!drawing) return;
      octx.clearRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
      drawing = false; activePointer = null;
    }
    function pointerList(){ return [...pointers.values()]; }
    function gestureFrom(a, b){
      const r = viewport.getBoundingClientRect();
      const mx = (a.x + b.x) / 2 - r.left;
      const my = (a.y + b.y) / 2 - r.top;
      return { dist: Math.hypot(a.x - b.x, a.y - b.y), mx, my, zoom, panX, panY };
    }

    function start(e){
      pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
      if(viewport.setPointerCapture){ try{ viewport.setPointerCapture(e.pointerId); }catch(err){} }

      if(pointers.size === 2){
        cancelStroke();
        const [a, b] = pointerList();
        gesture = gestureFrom(a, b);
        return;
      }
      if(pointers.size > 2) return;

      e.preventDefault();
      if(currentMode === 'grab'){
        gesture = { pan:true, x:e.clientX, y:e.clientY, panX, panY };
        return;
      }
      if(drawing) return;
      drawing = true; activePointer = e.pointerId; hasDrawn = true;
      const p = pos(e); startX = p.x; startY = p.y; lastX = p.x; lastY = p.y;
      if(currentMode === 'pen' || currentMode === 'eraser'){
        /* A tap with no movement should still leave a dot. */
        ctx.strokeStyle = strokeColor(); ctx.lineWidth = strokeWidth();
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 0.01, p.y); ctx.stroke();
      }
    }

    function move(e){
      if(pointers.has(e.pointerId)) pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

      if(gesture && gesture.pan && pointers.size === 1){
        e.preventDefault();
        panX = gesture.panX + (e.clientX - gesture.x);
        panY = gesture.panY + (e.clientY - gesture.y);
        clampPan(); applyView();
        return;
      }
      if(gesture && pointers.size >= 2){
        e.preventDefault();
        const [a, b] = pointerList();
        const now = gestureFrom(a, b);
        if(gesture.dist > 0){
          /* Scale about the midpoint, and follow the midpoint as it moves. */
          zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, gesture.zoom * (now.dist / gesture.dist)));
          panX = now.mx - (gesture.mx - gesture.panX) * (zoom / gesture.zoom);
          panY = now.my - (gesture.my - gesture.panY) * (zoom / gesture.zoom);
          clampPan(); applyView();
        }
        return;
      }

      if(!drawing || e.pointerId !== activePointer) return;
      e.preventDefault();
      const p = pos(e);
      if(currentMode === 'pen' || currentMode === 'eraser'){
        ctx.strokeStyle = strokeColor(); ctx.lineWidth = strokeWidth();
        ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke();
        lastX = p.x; lastY = p.y;
      } else {
        octx.clearRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
        drawShape(octx, currentMode, startX, startY, p.x, p.y, currentColor, currentSize, fillMode);
      }
    }

    function end(e){
      pointers.delete(e.pointerId);
      if(pointers.size < 2) gesture = pointers.size === 1 && gesture && gesture.pan ? gesture : null;
      if(!drawing || (e.pointerId != null && e.pointerId !== activePointer)) return;
      if(currentMode !== 'pen' && currentMode !== 'eraser' && currentMode !== 'grab'){
        const p = pos(e);
        drawShape(ctx, currentMode, startX, startY, p.x, p.y, currentColor, currentSize, fillMode);
        octx.clearRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
      }
      drawing = false; activePointer = null;
    }

    viewport.addEventListener('pointerdown', start);
    viewport.addEventListener('pointermove', move);
    viewport.addEventListener('pointerup', end);
    viewport.addEventListener('pointercancel', end);
    viewport.addEventListener('contextmenu', e=>e.preventDefault());

    document.getElementById('clearBtn').addEventListener('click', ()=>{
      if(hasDrawn && !confirm('Clear the whole drawing?')) return;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
      octx.clearRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
      hasDrawn = false;
    });

    /* Downscale before upload — full-resolution base64 would bloat the database. */
    function exportDrawing(){
      const out = document.createElement('canvas');
      out.width = EXPORT_SIZE; out.height = EXPORT_SIZE;
      const octx2 = out.getContext('2d');
      octx2.fillStyle = '#ffffff';
      octx2.fillRect(0,0,EXPORT_SIZE,EXPORT_SIZE);
      octx2.imageSmoothingEnabled = true;
      octx2.imageSmoothingQuality = 'high';
      octx2.drawImage(canvas, 0, 0, EXPORT_SIZE, EXPORT_SIZE);
      return out.toDataURL('image/jpeg', EXPORT_QUALITY);
    }

    document.getElementById('submitBtn').addEventListener('click', async ()=>{
      const btn = document.getElementById('submitBtn');
      if(!hasDrawn){ showToast('Draw something first!'); return; }
      btn.disabled = true; btn.textContent = '…';
      const name = document.getElementById('nameInput').value.trim() || 'Anonymous';
      /* Keep a full-resolution copy for them before the canvas goes away. */
      const keepsake = canvas.toDataURL('image/png');
      const latest = await getState();
      /* Keyed by the person, so everyone gets exactly one entry per round —
         the rules refuse any overwrite, and a new round clears the board. */
      const key = (AUTH_ENABLED && auth.uid) ? auth.uid : ('d' + Date.now() + Math.random().toString(36).slice(2,8));
      /* Written at its exact path so the rules validate this one drawing. */
      const entry = { name, dataUrl: exportDrawing(), ts: Date.now(), round: latest.round };
      let ok;
      if(boardId){
        /* The drawing and the owner's counter move together, or not at all. */
        const owner = await dbGet(bp('owner'));
        const ownerGrant = (typeof owner === 'string') ? await dbGet('grants/' + owner + '/imagesUsed') : null;
        const update = { ['boards/' + boardId + '/board/' + key]: entry };
        if(typeof ownerGrant === 'number') update['grants/' + owner + '/imagesUsed'] = ownerGrant + 1;
        ok = await dbUpdate(update);
      } else {
        ok = await dbPut(bp('board/' + key), entry);
      }
      if(!ok){
        btn.disabled = false; btn.textContent = 'Add';
        showToast(writeDenied ? 'This board is not accepting drawings right now — check with the host.'
                              : 'Could not save — check your connection and try again.');
        return;
      }
      const inner2 = document.getElementById('drawInner');
      inner2.innerHTML = `
        <div class="draw-wrap">
          <div class="confirm">
            <div class="stamp">✓</div>
            <h2>Added to the board!</h2>
            <p>Your drawing just showed up on the big screen.${AUTH_ENABLED ? ' One each per round — you are in.' : ''}</p>
            <div class="confirm-actions">
              ${AUTH_ENABLED ? '' : '<button class="btn" id="drawAgain">Draw another</button>'}
              <button class="btn secondary" id="saveMine">Save my drawing</button>
            </div>
          </div>
        </div>`;
      const againBtn = document.getElementById('drawAgain');
      if(againBtn) againBtn.addEventListener('click', ()=> renderDrawingPhase(state));
      document.getElementById('saveMine').addEventListener('click', ()=>{
        downloadDataUrl(keepsake, 'my-drawing-' + (safeFilePart(name) || 'anon') + '.png');
      });
    });
  }

  async function renderVotingPhase(state){
    const round = state.round;
    const myVote = getMyVote(round);
    const submissions = await fetchBoard(state);
    const inner = document.getElementById('drawInner');
    if(!inner) return;

    const sig = viewSignature(submissions, null, round + '|' + (myVote || ''));
    if(sig === lastVoteSignature && document.getElementById('voteGrid')) return;
    lastVoteSignature = sig;

    inner.innerHTML = `
      <div class="draw-wrap">
        <div class="panel">
          <div class="eyebrow">Voting is open</div>
          <h1>Pick your favourite</h1>
        </div>
        <div class="vote-grid" id="voteGrid"></div>
      </div>
    `;
    const grid = document.getElementById('voteGrid');
    if(submissions.length === 0){
      grid.innerHTML = '<div class="muted-row">No drawings were submitted this round.</div>';
      return;
    }
    submissions.forEach(item=>{
      const card = document.createElement('div');
      card.className = 'vote-card' + (myVote === item.key ? ' chosen' : '');
      card.innerHTML = `
        <img src="${esc(item.dataUrl)}" alt="Drawing by ${esc(item.name)}">
        <div class="who">${esc(item.name)}</div>
        <button class="vote-btn" ${myVote ? 'disabled' : ''}>${myVote === item.key ? 'Voted ✓' : (myVote ? 'Voting closed' : 'Vote for this')}</button>
      `;
      const btn = card.querySelector('.vote-btn');
      if(!myVote){
        btn.addEventListener('click', async ()=>{
          btn.disabled = true; btn.textContent = 'Saving…';
          const voterId = await getVoterId();
          const ok = await dbPut(bp('votes/' + voterId), { choice: item.key, ts: Date.now(), round });
          if(!ok){
            showToast(writeDenied ? 'Voting is closed for this session.' : 'Vote did not save — try again.');
            btn.disabled = false; btn.textContent = 'Vote for this';
            return;
          }
          setMyVote(round, item.key);
          renderVotingPhase(state);
        });
      }
      grid.appendChild(card);
    });
  }

  async function renderResultsPhase(state){
    const submissions = await fetchBoard(state);
    const votes = await fetchVotes(state);
    const counts = tallyVotes(votes);
    const ranked = [...submissions].sort((a,b)=>(counts[b.key]||0)-(counts[a.key]||0));
    const topCount = ranked.length ? (counts[ranked[0].key]||0) : 0;
    const inner = document.getElementById('drawInner');
    if(!inner) return;

    const sig = viewSignature(ranked, counts, state.round);
    if(sig === lastResultsSignature && document.getElementById('resultsGrid')) return;
    lastResultsSignature = sig;

    inner.innerHTML = `
      <div class="draw-wrap">
        <div class="panel"><div class="eyebrow">Results</div><h1>🏆 Top drawings</h1></div>
        <div class="vote-grid" id="resultsGrid"></div>
      </div>
    `;
    const grid = document.getElementById('resultsGrid');
    if(ranked.length === 0){ grid.innerHTML = '<div class="muted-row">No drawings this round.</div>'; return; }
    ranked.forEach(item=>{
      const c = counts[item.key] || 0;
      const card = document.createElement('div');
      card.className = 'vote-card';
      card.innerHTML = `
        ${c === topCount && topCount > 0 ? '<div class="crown">👑</div>' : ''}
        <img src="${esc(item.dataUrl)}" alt="Drawing by ${esc(item.name)}">
        <div class="who">${esc(item.name)}</div>
        <div class="vote-count">${c} vote${c===1?'':'s'}</div>

  function enterPresentMode(){
    if(presenting) return;
    presenting = true;
    lastScreenSignature = null;
    screenQrDone = false;
    const overlay = document.createElement('div');
    overlay.className = 'screen-overlay';
    overlay.id = 'screenOverlay';
    overlay.innerHTML = screenShellMarkup(true);
    document.body.appendChild(overlay);
    document.getElementById('exitPresentBtn').addEventListener('click', exitPresentMode);
    document.addEventListener('keydown', presentEscape);
    if(document.documentElement.requestFullscreen){
      document.documentElement.requestFullscreen().catch(()=>{});
    }
  }
  function exitPresentMode(){
    presenting = false;
    const overlay = document.getElementById('screenOverlay');
    if(overlay) overlay.remove();
    document.removeEventListener('keydown', presentEscape);
    if(document.fullscreenElement && document.exitFullscreen){
      document.exitFullscreen().catch(()=>{});

  const PURGE_SWEEP_MS = 60000;
  async function maybePurge(state){
    const roundChanged = state.round !== lastPurgedRound;
    if(!roundChanged && Date.now() - lastPurgeAt < PURGE_SWEEP_MS) return;
    lastPurgedRound = state.round;
    lastPurgeAt = Date.now();
    await purgeStaleData(state);
  }

    async function copy(text, btn, label){
      try{ await navigator.clipboard.writeText(text); btn.textContent = 'Copied ✓'; }
      catch(e){ showToast('Copy failed — select the text manually.'); return; }
      setTimeout(()=>{ btn.textContent = label; }, 2000);
    }
    document.getElementById('copyRulesBtn').addEventListener('click', (e)=> copy(rulesForHost(), e.target, 'Copy database rules'));
  }

  function updateSecurityChips(openUntil){
    const mode = document.getElementById('secMode');
    const sess = document.getElementById('secSession');
    if(!mode || !sess) return;
    if(!AUTH_ENABLED){
      mode.textContent = '⚠️ Test mode — open to anyone';
      mode.className = 'sec-chip warn';
      sess.textContent = '';
      return;
    }
    mode.textContent = auth.error ? '⚠️ Sign-in problem' : '🔒 Locked down';
    mode.className = 'sec-chip ' + (auth.error ? 'warn' : 'ok');
    const open = openUntil > serverNow();
    sess.textContent = open ? 'Guests can draw · closes ' + new Date(openUntil).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : 'Session closed';
    sess.className = 'sec-chip ' + (open ? 'ok' : '');
  }

  let hostDeniedWarned = false;

  async function hostPollLoop(){
    const state = await getState();
    noteState(state);

    /* If the rules reject the host, the host ID in them is not this browser's. */
    if(readDenied && !hostDeniedWarned){
      hostDeniedWarned = true;
      const panel = document.getElementById('secPanel');
      if(panel) panel.open = true;
      showToast('Firebase is refusing this board — check the rules use the host ID shown below.');
    } else if(!readDenied){
      hostDeniedWarned = false;
    }

    updateSecurityChips(await getSessionOpenUntil());
    if(AUTH_ENABLED && isSignedInHost() && !iAmUnlimited){ await loadAllowance(); paintAllowanceBanner(); }
    const topicInput = document.getElementById('topicInput');

    /* Never clobber what the host is typing. Only sync the field when it is
       untouched and the topic actually changed on the server. */
    if(topicInput && !topicDirty && document.activeElement !== topicInput){
      const remote = state.topic || '';
      if(remote !== lastRemoteTopic){
        topicInput.value = remote;
        lastRemoteTopic = remote;
      }
    }

    const badge = document.getElementById('phaseBadge');
    badge.textContent = state.phase;
    badge.className = 'phase-badge ' + state.phase;

    if(state.phase === 'drawing' && state.timerEnd && state.timerEnd - serverNow() <= 0){
      state.phase = 'voting'; state.timerEnd = null;
      await setState(state);
    }

    /* A second screen may have been told to hide/show; follow the shared flag. */
    if(typeof state.hideDrawings === 'boolean' && state.hideDrawings !== drawingsHidden){
      drawingsHidden = state.hideDrawings;
      applyHiddenState();
    }

    /* Refresh first: the purge reads the cache that this populates. */
    await refreshHostBoard(state);
    await maybePurge(state);
    if(presenting) await paintScreen(state, drawingsHidden);
    setTimeout(hostPollLoop, POLL_MS);
  }

  async function refreshHostBoard(state){
    const boardEl = document.getElementById('board');
    const emptyEl = document.getElementById('emptyState');
    const countEl = document.getElementById('countText');
    const submissions = await fetchBoard(state);

    if(submissions.length === 0){
      boardEl.innerHTML = ''; emptyEl.style.display = 'block'; countEl.textContent = '0 drawings';
      lastHostSignature = 'empty';
      applyHiddenState();
      return;
    }
    emptyEl.style.display = 'none';
    countEl.textContent = submissions.length + (submissions.length===1 ? ' drawing' : ' drawings');

    let counts = {};
    let ordered = submissions;
    if(state.phase === 'voting' || state.phase === 'results'){
      const votes = await fetchVotes(state);
      counts = tallyVotes(votes);
      if(state.phase === 'results'){
        ordered = [...submissions].sort((a,b)=>(counts[b.key]||0)-(counts[a.key]||0));
      }
    }
    const topCount = state.phase === 'results' && ordered.length ? (counts[ordered[0].key]||0) : -1;

    const sig = viewSignature(ordered, counts, state.phase);
    if(sig === lastHostSignature && boardEl.children.length){ applyHiddenState(); return; }
    lastHostSignature = sig;

    const dotColors = ['#e5484d','#2f9e68','#5b5bd6','#f5a524','#3ba3a3','#c15a9e'];

    boardEl.innerHTML = ordered.map(item=>{
      const h = hashCode(item.key);
      const dot = dotColors[Math.abs(h) % dotColors.length];
      const name = esc(item.name || 'Anonymous');
      const isWinner = state.phase === 'results' && topCount > 0 && (counts[item.key]||0) === topCount;
      const voteBadge = (state.phase === 'voting' || state.phase === 'results') ? `<div class="votes-badge">${counts[item.key]||0} ${(counts[item.key]||0)===1?'vote':'votes'}</div>` : '';
      return `
        <div class="pin-card${isWinner ? ' winner' : ''}">
          <img src="${esc(item.dataUrl)}" alt="Drawing by ${name}">
          ${voteBadge}
          <div class="who"><span class="dot" style="background:${dot};"></span>${name}${isWinner ? ' 👑' : ''}</div>
        </div>
      `;
    }).join('');
    applyHiddenState();
  }

  /* "How would I even know how to host?" — the answer has to live in the app,
     not only in a README nobody has a link to. */
  function openHelp(){
    if(document.getElementById('helpOverlay')) return;
    const el = document.createElement('div');
    el.className = 'help-overlay';
    el.id = 'helpOverlay';
    const here = window.location.origin + window.location.pathname;
    el.innerHTML = `
      <div class="help-card" role="dialog" aria-label="How this works">
        <button class="help-close" id="helpClose" aria-label="Close">✕</button>
        <h2>How this works</h2>

        <div class="help-section">
          <div class="help-head">🎨 Playing</div>
          <p>Get the 6-character code from the presenter's screen, type it in, and draw.
             You never sign in or install anything.</p>
        </div>

        <div class="help-section">
          <div class="help-head">🖥 Hosting a game</div>
          <ol>
            <li><strong>Sign in</strong> with an email and password — it takes a minute and it is free.</li>
            <li><strong>Create a board</strong> and name it after your event. You get a 6-character code.</li>
            <li><strong>Press Present to the room</strong> so the big screen shows the code and drawings, and not your controls.</li>
            <li><strong>Set a topic</strong>, start the timer, then open voting and show the results.</li>
            <li><strong>New round</strong> clears the board for the next topic.</li>
          </ol>
        </div>

        <div class="help-section">
          <div class="help-head">↩︎ Getting back to your board</div>
          <p>Your boards live with your account, not with this browser. Come back to
             <code class="help-url">${esc(here.replace(/^https?:\/\//,''))}</code>,
             choose <strong>Sign in as host</strong>, and every board you have made is listed there —
             from any laptop.</p>
        </div>

        ${BUILT_IN.docsUrl ? `<a class="btn secondary help-docs" href="${esc(BUILT_IN.docsUrl)}" target="_blank" rel="noopener">Read the full guide</a>` : ''}
      </div>`;
    document.body.appendChild(el);
    document.getElementById('helpClose').addEventListener('click', closeHelp);
    el.addEventListener('click', (e)=>{ if(e.target === el) closeHelp(); });
    document.addEventListener('keydown', helpEscape);
  }
  function closeHelp(){
    const el = document.getElementById('helpOverlay');
    if(el) el.remove();
    document.removeEventListener('keydown', helpEscape);
  }
  function helpEscape(e){ if(e.key === 'Escape') closeHelp(); }

  /* Someone who just opens the address has no idea what to do next: they might
     be a player looking for a board, or a presenter about to run one. Ask. */
  function renderLanding(){
    const canHost = !!dbUrl;
    /* A host who has been here before should not have to read a pitch about
       hosting to find the way back in. */
    const returning = !!(AUTH_ENABLED && canHost && auth.refreshToken && !auth.isAnon);
    app.innerHTML = `
      <div class="setup-wrap">
        <div class="setup-card join-card">
          <button class="btn ghost landing-signin" id="topSignInBtn">${canHost ? 'Sign in' : 'Set up'}</button>
          <div class="landing-mark">🎨</div>
          <h2>Draw the Topic</h2>
          <p class="sub">Everyone draws the same topic on their phone, then the room votes for a favourite.</p>

          ${returning ? `
          <div class="landing-welcome">
            <div class="landing-label">Welcome back</div>
            <p class="landing-hint">${esc(auth.email || 'You are signed in')}</p>
            <button class="btn landing-go" id="continueBtn">Go to my boards</button>
          </div>` : ''}

          <div class="landing-block">
            <div class="landing-label">Joining a game?</div>
            <p class="landing-hint">Type the 6-character code from the presenter's screen.</p>
            <input id="joinCode" class="field join-input" type="text" inputmode="latin"
                   autocapitalize="characters" autocomplete="off" spellcheck="false"
                   maxlength="${CODE_LENGTH}" placeholder="ABC123" aria-label="Board code">
            <div class="err" id="joinErr"></div>
            <button class="btn landing-go" id="joinBtn">Join the game</button>
          </div>

          <div class="landing-split"><span>or</span></div>

          <div class="landing-block">
            <div class="landing-label">Running the game?</div>
            <p class="landing-hint">${canHost
              ? 'Sign in with an email and password — free, takes a minute — then create a board and share its code with the room.'
              : 'This copy has no board database yet. Add your own Firebase details to sign in and start hosting.'}</p>
            <button class="btn secondary landing-go" id="hostGoBtn">${canHost ? (returning ? 'Sign in as someone else' : 'Sign in or create an account') : 'Add my Firebase details'}</button>
          </div>

          <button class="btn ghost landing-help" id="landingHelpBtn">New here? How this works</button>
        </div>
      </div>`;

    const input = document.getElementById('joinCode');
    const err = document.getElementById('joinErr');
    input.addEventListener('input', ()=>{
      input.value = input.value.toUpperCase().replace(new RegExp('[^' + CODE_ALPHABET + ']', 'g'), '');
      err.textContent = '';
    });
    function join(){
      const code = input.value.trim().toUpperCase();
      if(!looksLikeCode(code)){ err.textContent = `Codes are ${CODE_LENGTH} characters, like ABC123.`; return; }
      const url = new URL(window.location.href);
      url.searchParams.set('b', code);
      window.location.href = url.toString();
    }
    document.getElementById('joinBtn').addEventListener('click', join);
    input.addEventListener('keydown', e=>{ if(e.key === 'Enter') join(); });
    document.getElementById('landingHelpBtn').addEventListener('click', openHelp);
    function goHost(){
      const url = new URL(window.location.href);
      url.searchParams.delete('settings');
      url.searchParams.set('host', '1');
      window.location.href = url.toString();
    }
    function goSettings(){
      const url = new URL(window.location.href);
      url.searchParams.set('settings', '1');
      window.location.href = url.toString();
    }
    /* Signing in needs a database to sign in to. With one already configured
       (shared, or saved earlier in Settings) go straight to it; otherwise the
       first step of "signing in" is adding one — Settings does that and then
       lands on the sign-in form itself, so the button stays labelled Sign in
       rather than forking into a separate, easy-to-miss setup path. */
    const enterHost = canHost ? goHost : goSettings;
    document.getElementById('hostGoBtn').addEventListener('click', enterHost);
    document.getElementById('topSignInBtn').addEventListener('click', enterHost);
    const continueBtn = document.getElementById('continueBtn');
    if(continueBtn) continueBtn.addEventListener('click', goHost);
    /* Do not pop a keyboard at a returning host who is here to press one button. */
    if(!returning) input.focus();
  }

  /* ================= ROUTER ================= */
  if(isHost && !dbUrl){
    renderSetup();
  } else if(params.get('settings') === '1'){
    renderSettings();
  } else if(isHost){
    /* Hosts go to sign-in and their board picker, board or not. */
    startHost();
  } else if(params.get('screen') === '1' && boardId){
    renderScreenView();
  } else if(!boardId && params.get('db')){
    /* A link that names its own database and no board is a pre-boards link;
       it still means "the one shared board". */
    renderDrawShell();
    drawPollLoop();
  } else if(!boardId){
    /* Bare address — ask whether they are playing or hosting. */
    renderLanding();
  } else {
    renderDrawShell();
    drawPollLoop();
  }
})();
</script>
