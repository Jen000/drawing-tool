          <div class="board-title-wrap">
            <h1 id="boardTitle">The board</h1>
            <span class="count" id="countText">0 drawings</span>
          </div>
          <div class="board-actions">
            <button class="btn secondary small" id="hideBtn">🙈 Hide drawings</button>
            <button class="btn ghost small" id="switchBoardBtn" style="display:none;">Switch board</button>
            <button class="btn ghost small" id="signOutBtn2" style="display:none;">Sign out</button>
          </div>
        </div>
        <div id="board"></div>
        <div class="hidden-banner" id="hiddenBanner" style="display:none;">Drawings are hidden — press Show drawings for the reveal.</div>
        <div class="empty-state" id="emptyState" style="display:none;">Nothing here yet — scan the QR code to add the first drawing.</div>
      </div>
    `;

    /* The QR library is deferred, so draw as soon as it turns up and fall back
       to the plain link if it never does. */
    function renderQr(){
      const el = document.getElementById('qrcode');
      if(!el) return true;
      if(typeof QRCode === 'undefined'){ el.textContent = participantUrl(); return false; }
      try{
        el.textContent = '';
        new QRCode(el, { text: participantUrl(), width: 148, height: 148, colorDark: '#0f1729', colorLight: '#ffffff' });
        return true;
      }catch(e){ el.textContent = participantUrl(); return false; }
    }
    if(!renderQr()){
      window.addEventListener('load', renderQr, { once:true });
      setTimeout(renderQr, 1500);
      setTimeout(renderQr, 5000);
    }

    const topicInput = document.getElementById('topicInput');
    const topicHint = document.getElementById('topicHint');

    function setHint(msg, saved){
      topicHint.textContent = msg;
      topicHint.classList.toggle('saved', !!saved);
    }
    topicInput.addEventListener('input', ()=>{
      topicDirty = true;
      setHint('Unsaved — press Enter or Update topic', false);
    });
    topicInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') saveTopic(); });

    async function saveTopic(){
      const val = topicInput.value.trim();
      const state = await getState();
      state.topic = val;
      const ok = await setState(state);
      if(!ok){ setHint('Could not save — check your connection', false); showToast('Could not update topic — check your connection.'); return; }
      /* Only stop protecting the field once the new value is safely stored. */
      topicDirty = false;
      lastRemoteTopic = val;
      setHint('Topic updated ✓', true);
      setTimeout(()=>{ if(!topicDirty) setHint('', false); }, 2500);
    }
    document.getElementById('saveTopicBtn').addEventListener('click', saveTopic);

    document.getElementById('startTimerBtn').addEventListener('click', async ()=>{
      const mins = Math.max(1, parseInt(document.getElementById('minutesInput').value, 10) || 3);
      await reopenSession();
      const state = await getState();
      state.phase = 'drawing';
      state.timerEnd = Date.now() + mins*60000;
      await setState(state);
    });
    document.getElementById('votingBtn').addEventListener('click', async ()=>{
      const state = await getState();
      state.phase = 'voting'; state.timerEnd = null;
      await setState(state);
    });
    document.getElementById('resultsBtn').addEventListener('click', async ()=>{
      const state = await getState();
      state.phase = 'results';
      await setState(state);
    });
    document.getElementById('newRoundBtn').addEventListener('click', async ()=>{
      if(!confirm('Start a fresh round?\n\nEvery drawing and vote from this round is permanently deleted from Firebase.')) return;
      const btn = document.getElementById('newRoundBtn');
      btn.disabled = true; btn.textContent = 'Clearing…';
      await reopenSession();
      const clean = await wipeRoundData();
      const state = await getState();
      state.phase = 'drawing';
      state.timerEnd = null;
      state.round = 'r' + Date.now();
      state.roundStartedAt = Date.now();
      await setState(state);
      btn.disabled = false; btn.textContent = 'New round';
      showToast(clean ? 'New round started — previous drawings deleted.' : 'New round started, but some data could not be deleted. Retrying in the background.');
    });
    document.getElementById('wipeBtn').addEventListener('click', async ()=>{
      if(!confirm('Erase all data?\n\nThis deletes every drawing, vote and the current topic from Firebase.')) return;
      const btn = document.getElementById('wipeBtn');
      btn.disabled = true; btn.textContent = 'Erasing…';
      const clean = await wipeRoundData();
      const fresh = { ...DEFAULT_STATE, round: 'r' + Date.now(), roundStartedAt: Date.now() };
      await setState(fresh);
      topicDirty = false; lastRemoteTopic = null;
      btn.disabled = false; btn.textContent = 'Erase all data now';
      showToast(clean ? 'All drawings and votes erased from Firebase.' : 'Some data could not be erased — check your connection.');
    });
    document.getElementById('downloadBtn').addEventListener('click', ()=>{
      if(typeof html2canvas === 'undefined'){
        showToast('Board capture needs its library — check your connection, or take a screenshot instead.');
        return;
      }
      html2canvas(document.querySelector('.host-wrap'), {backgroundColor:'#131a2e', scale:2}).then(canvas=>{
        const link = document.createElement('a');
        link.download = 'topic-drawing-board.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(()=>{ showToast('Could not capture the board image — try a regular screenshot instead.'); });
    });

    /* Hide the board for a reveal, or to stop guests copying each other. */
    const hideBtn = document.getElementById('hideBtn');
    hideBtn.addEventListener('click', ()=>{
      drawingsHidden = !drawingsHidden;
      applyHiddenState();
    });

    if(isSignedInHost()){
      const switchBtn = document.getElementById('switchBoardBtn');
      const outBtn = document.getElementById('signOutBtn2');
      switchBtn.style.display = '';
      outBtn.style.display = '';
      switchBtn.addEventListener('click', ()=>{
        const url = new URL(window.location.href);
        url.searchParams.delete('b');
        window.location.href = url.toString();
      });
      outBtn.addEventListener('click', ()=>{
        clearAuth();
        const url = new URL(window.location.href);
        url.searchParams.delete('b');
        window.location.href = url.toString();
      });
      getBoardMeta().then(meta=>{
        const t = document.getElementById('boardTitle');
        if(meta && meta.name && t) t.textContent = meta.name;
      });
    }

    const closeBtn = document.getElementById('closeSessionBtn');
    if(AUTH_ENABLED){
      closeBtn.style.display = '';
      closeBtn.addEventListener('click', async ()=>{
        if(!confirm('Close this session?\n\nGuests will not be able to add drawings or vote until you reopen the board.')) return;
        sessionHeldOpen = false;
        const ok = await closeSessionWindow();
        showToast(ok ? 'Session closed — the QR code no longer accepts drawings.' : 'Could not close the session — check your connection.');
      });
    }

    renderSecurityPanel();
    /* Hold the door open while the board is on screen; it lapses on its own
       once the board is closed, so an old QR code goes dead by itself. */
    await openSessionWindow();
    setInterval(()=>{ if(sessionHeldOpen) openSessionWindow(); }, HEARTBEAT_MS);

    hostPollLoop();
  }

  /* Starting a round or a timer means the host is running the board again. */
  async function reopenSession(){
    sessionHeldOpen = true;
    await openSessionWindow();
  }

  const RULES_TEMPLATE = `{
  "rules": {
    ".read": false,
    ".write": false,

    "users": {
      "$uid": {
        ".read": "auth != null && auth.uid === $uid",
        ".write": "auth != null && auth.uid === $uid"
      }
    },

    "boards": {
      "$b": {
        ".read": "auth != null && (root.child('boards').child($b).child('owner').val() === auth.uid || root.child('boards').child($b).child('session/openUntil').val() > now)",
        ".write": "auth != null && root.child('boards').child($b).child('owner').val() === auth.uid",

        "owner": {
          ".write": "auth != null && !data.exists() && newData.val() === auth.uid",
          ".validate": "newData.isString()"
        },

        "meta": {
          ".validate": "newData.hasChildren(['name'])",
          "name":      { ".validate": "newData.isString() && newData.val().length <= 40" },
          "createdAt": { ".validate": "newData.isNumber()" },
          "$other":    { ".validate": false }
        },

        "session": {
          "openUntil": { ".validate": "newData.isNumber()" },
          "$other":    { ".validate": false }
        },

        "state": {
          ".validate": "newData.hasChildren(['phase', 'round'])"
        },

        "board": {
          "$drawing": {
            ".write": "auth != null && !data.exists() && newData.exists() && root.child('boards').child($b).child('session/openUntil').val() > now",
            ".validate": "newData.hasChildren(['name', 'dataUrl', 'ts', 'round'])",
            "name":    { ".validate": "newData.isString() && newData.val().length <= 24" },
            "dataUrl": { ".validate": "newData.isString() && newData.val().length <= 400000 && newData.val().beginsWith('data:image/jpeg;base64,')" },
            "ts":      { ".validate": "newData.isNumber()" },
            "round":   { ".validate": "newData.isString() && newData.val() === root.child('boards').child($b).child('state/round').val()" },
            "$other":  { ".validate": false }
          }
        },

        "votes": {
          "$voter": {
            ".write": "auth != null && $voter === auth.uid && !data.exists() && newData.exists() && root.child('boards').child($b).child('session/openUntil').val() > now",
            ".validate": "newData.hasChildren(['choice', 'ts', 'round'])",
            "choice": { ".validate": "newData.isString() && root.child('boards').child($b).child('board').child(newData.val()).exists()" },
            "ts":     { ".validate": "newData.isNumber()" },
            "round":  { ".validate": "newData.isString() && newData.val() === root.child('boards').child($b).child('state/round').val()" },
            "$other": { ".validate": false }
          }
        }
      }
    }
  }
}`;

  function rulesForHost(){ return RULES_TEMPLATE; }

  async function renderSecurityPanel(){
    const body = document.getElementById('secBody');
    if(!body) return;
    if(AUTH_ENABLED) await getIdToken();

    if(!AUTH_ENABLED){
      body.innerHTML = `
        <p class="sec-lead">This board is running in <strong>test mode</strong>: anyone who has the database URL can read, add or delete drawings, at any time of day.</p>
        <p class="sec-lead">Locking it down also unlocks host accounts and separate boards per presenter. Guests still just scan and draw — no login, no prompt.</p>
        <ol class="sec-steps">
          <li>In Firebase: <strong>Build → Authentication → Get started</strong>, then enable both <strong>Anonymous</strong> (for guests) and <strong>Email/Password</strong> (for hosts).</li>
          <li>In <strong>Project settings → General → Your apps</strong>, click the web icon <code>&lt;/&gt;</code> to register a web app if you have not already (any nickname, skip Hosting). Firebase then shows a config snippet.</li>
          <li>Copy the <code>apiKey</code> value from that snippet — it starts with <code>AIza</code>. It is safe to share; your database rules do the protecting.</li>
          <li>Paste it below. This page then asks you to create a host account, and to create your first named board — just follow the two screens.</li>
          <li><strong>Last of all</strong>, copy the database rules into <strong>Realtime Database → Rules</strong> and Publish. Leave this until after step 4, or a page still on the old link will lock itself out.</li>
        </ol>
        <div class="sec-row">
          <input id="apiKeyInput" class="field" type="text" placeholder="Web API key (AIza…)">
          <button class="btn small" id="apiKeyBtn">Turn on locked-down mode</button>
        </div>`;
      document.getElementById('apiKeyBtn').addEventListener('click', ()=>{
        const val = document.getElementById('apiKeyInput').value.trim();
        if(!val){ showToast('Paste your Web API key first.'); return; }
        const url = new URL(window.location.href);
        url.searchParams.set('key', val);
        window.location.href = url.toString();
      });
      return;
    }

    if(auth.error){
      const msg = auth.error === 'OPERATION_NOT_ALLOWED'
        ? 'Anonymous sign-in is not enabled yet. In Firebase go to <strong>Build → Authentication → Sign-in method → Anonymous → Enable</strong>, then reload this page.'
        : 'Could not sign in to Firebase (' + esc(auth.error) + '). Check the Web API key in this page\'s address.';
      body.innerHTML = `<p class="sec-lead sec-warn">${msg}</p>`;
      return;
    }

    body.innerHTML = `
      <p class="sec-lead">Guests are signed in anonymously and can only add drawings while <strong>this</strong> board is open. You own this board through your account, so it follows you to any device you present from — and other presenters' boards stay separate from yours.</p>
      <div class="sec-row">
        <span class="eyebrow">Signed in as</span>
        <code class="sec-uid">${esc(auth.email || auth.uid || '')}</code>
      </div>
      <p class="sec-note">These rules are the same for everyone — there is nothing to fill in. Paste them into <strong>Realtime Database → Rules</strong> in Firebase once, and every board in this project is covered.</p>
      <div class="sec-row"><button class="btn small" id="copyRulesBtn">Copy database rules</button></div>
      <pre class="sec-rules" id="secRules">${esc(rulesForHost())}</pre>`;

    async function copy(text, btn, label){
      try{ await navigator.clipboard.writeText(text); btn.textContent = 'Copied ✓'; }
      catch(e){ showToast('Copy failed — select the text manually.'); return; }
      setTimeout(()=>{ btn.textContent = label; }, 2000);
    }
    document.getElementById('copyRulesBtn').addEventListener('click', (e)=> copy(rulesForHost(), e.target, 'Copy database rules'));
  }

  function updateSecurityChips(openUntil){
    const mode = document.getElementById('secMode');
    const sess = document.getElementById('secSession');
    if(!mode || !sess) return;
    if(!AUTH_ENABLED){
      mode.textContent = '⚠️ Test mode — open to anyone';
      mode.className = 'sec-chip warn';
      sess.textContent = '';
      return;
    }
    mode.textContent = auth.error ? '⚠️ Sign-in problem' : '🔒 Locked down';
    mode.className = 'sec-chip ' + (auth.error ? 'warn' : 'ok');
    const open = openUntil > serverNow();
    sess.textContent = open ? 'Guests can draw · closes ' + new Date(openUntil).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : 'Session closed';
    sess.className = 'sec-chip ' + (open ? 'ok' : '');
  }

  let hostDeniedWarned = false;

  async function hostPollLoop(){
    const state = await getState();

    /* If the rules reject the host, the host ID in them is not this browser's. */
    if(readDenied && !hostDeniedWarned){
      hostDeniedWarned = true;
      const panel = document.getElementById('secPanel');
      if(panel) panel.open = true;
      showToast('Firebase is refusing this board — check the rules use the host ID shown below.');
    } else if(!readDenied){
      hostDeniedWarned = false;
    }

    updateSecurityChips(await getSessionOpenUntil());
    const topicInput = document.getElementById('topicInput');

    /* Never clobber what the host is typing. Only sync the field when it is
       untouched and the topic actually changed on the server. */
    if(topicInput && !topicDirty && document.activeElement !== topicInput){
      const remote = state.topic || '';
      if(remote !== lastRemoteTopic){
        topicInput.value = remote;
        lastRemoteTopic = remote;
      }
    }

    const badge = document.getElementById('phaseBadge');
    badge.textContent = state.phase;
    badge.className = 'phase-badge ' + state.phase;

    const timerEl = document.getElementById('hostTimer');
    if(state.phase === 'drawing' && state.timerEnd){
      const remaining = state.timerEnd - Date.now();
      timerEl.textContent = fmtTime(remaining);
      timerEl.style.color = remaining < 15000 ? 'var(--danger)' : '';
      if(remaining <= 0){
        state.phase = 'voting'; state.timerEnd = null;
        await setState(state);
      }
    } else {
      timerEl.textContent = '';
    }

    await maybePurge(state);
    await refreshHostBoard(state);
    setTimeout(hostPollLoop, POLL_MS);
  }

  async function refreshHostBoard(state){
    const boardEl = document.getElementById('board');
    const emptyEl = document.getElementById('emptyState');
    const countEl = document.getElementById('countText');
    const submissions = await fetchBoard(state);

    if(submissions.length === 0){
      boardEl.innerHTML = ''; emptyEl.style.display = 'block'; countEl.textContent = '0 drawings';
      applyHiddenState();
      return;
    }
    emptyEl.style.display = 'none';
    countEl.textContent = submissions.length + (submissions.length===1 ? ' drawing' : ' drawings');

    let counts = {};
    let ordered = submissions;
    if(state.phase === 'voting' || state.phase === 'results'){
      const votes = await fetchVotes(state);
      counts = tallyVotes(votes);
      if(state.phase === 'results'){
        ordered = [...submissions].sort((a,b)=>(counts[b.key]||0)-(counts[a.key]||0));
      }
    }
    const topCount = state.phase === 'results' && ordered.length ? (counts[ordered[0].key]||0) : -1;
    const dotColors = ['#e5484d','#2f9e68','#5b5bd6','#f5a524','#3ba3a3','#c15a9e'];

    boardEl.innerHTML = ordered.map(item=>{
      const h = hashCode(item.key);
      const dot = dotColors[Math.abs(h) % dotColors.length];
      const name = esc(item.name || 'Anonymous');
      const isWinner = state.phase === 'results' && topCount > 0 && (counts[item.key]||0) === topCount;
      const voteBadge = (state.phase === 'voting' || state.phase === 'results') ? `<div class="votes-badge">${counts[item.key]||0} ${(counts[item.key]||0)===1?'vote':'votes'}</div>` : '';
      return `
        <div class="pin-card${isWinner ? ' winner' : ''}">
          <img src="${esc(item.dataUrl)}" alt="Drawing by ${name}">
          ${voteBadge}
          <div class="who"><span class="dot" style="background:${dot};"></span>${name}${isWinner ? ' 👑' : ''}</div>
        </div>
      `;
    }).join('');
    applyHiddenState();
  }

  /* ================= ROUTER ================= */
  if(!dbUrl){
    if(isHost){ renderSetup(); }
    else { app.innerHTML = '<div class="setup-wrap"><div class="setup-card"><h2>Ask your host for the QR code</h2><p class="sub">This link is missing its board address.</p></div></div>'; }
  } else if(isHost){
    startHost();
  } else {
    renderDrawShell();
    drawPollLoop();
  }
})();
</script>
</body>
</html>
