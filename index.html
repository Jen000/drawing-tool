<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1729">
<title>Draw the Topic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"></noscript>
<!-- deferred: venue wifi should never be able to stop the board from rendering -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  :root{
    --bg:#f4f5fa;
    --surface:#ffffff;
    --surface-2:#eef0f7;
    --ink:#0f1729;
    --ink-soft:#606b85;
    --line:#e3e6f0;
    --accent:#5b5bd6;
    --accent-hi:#7c6cf0;
    --accent-soft:#eceafc;
    --danger:#e5484d;
    --warn:#f5a524;
    --ok:#2f9e68;
    --radius:14px;
    --radius-lg:20px;
    --shadow-sm:0 1px 2px rgba(15,23,41,.05), 0 1px 3px rgba(15,23,41,.07);
    --shadow-md:0 6px 20px rgba(15,23,41,.09);
    --shadow-lg:0 20px 50px rgba(8,12,25,.28);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1421; --surface:#171d2c; --surface-2:#111726;
      --ink:#eef1f8; --ink-soft:#98a2ba; --line:#262d40;
      --accent:#7c6cf0; --accent-hi:#9a8dff; --accent-soft:#232041;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
      --shadow-md:0 6px 20px rgba(0,0,0,.45);
    }
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk','Inter',sans-serif;letter-spacing:-.02em;font-weight:600;}
  button,input{font-family:inherit;}
  button{cursor:pointer;border:none;}
  :focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px;}

  .btn{
    padding:11px 20px;border-radius:12px;font-weight:600;font-size:14px;
    background:var(--accent);color:#fff;
    box-shadow:0 1px 2px rgba(15,23,41,.12);
    transition:background .15s ease, transform .1s ease, opacity .15s ease;
  }
  .btn:hover{background:var(--accent-hi);}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  .btn.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-sm);}
  .btn.secondary:hover{background:var(--surface-2);}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid transparent;box-shadow:none;}
  .btn.ghost:hover{background:var(--surface-2);color:var(--ink);}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid rgba(229,72,77,.35);box-shadow:none;}
  .btn.danger:hover{background:rgba(229,72,77,.1);}
  .btn.small{padding:8px 14px;font-size:13px;border-radius:10px;}
  .eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}

  .field{
    width:100%;padding:12px 14px;border-radius:12px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    font-size:15px;transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none;}
  .field::placeholder{color:var(--ink-soft);opacity:.8;}

  /* ---------- setup ---------- */
  .setup-wrap{max-width:560px;margin:0 auto;padding:48px 20px;}
  .setup-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:28px;box-shadow:var(--shadow-md);}
  .setup-card h2{margin:0 0 6px;font-size:24px;}
  .setup-card .sub{color:var(--ink-soft);font-size:14px;margin:0 0 18px;}
  .setup-card ol{padding-left:18px;line-height:1.8;font-size:14px;color:var(--ink-soft);margin:0 0 20px;}
  .setup-card ol strong{color:var(--ink);}
  .setup-card a{color:var(--accent);}
  .setup-card code{background:var(--surface-2);padding:1px 6px;border-radius:5px;font-size:12.5px;}
  .err{color:var(--danger);font-size:13px;margin-top:10px;}

  /* ---------- participant shells ---------- */
  .draw-wrap{max-width:560px;margin:0 auto;padding:24px 16px 40px;}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);text-align:center;margin-bottom:18px;}
  .panel h1{font-size:24px;margin:6px 0 0;}
  .confirm{text-align:center;padding:56px 20px;}
  .confirm .stamp{
    width:64px;height:64px;margin:0 auto 16px;border-radius:20px;
    display:flex;align-items:center;justify-content:center;font-size:30px;
    background:linear-gradient(140deg,var(--accent),var(--accent-hi));
    box-shadow:0 10px 24px rgba(91,91,214,.35);
  }
  .confirm h2{font-size:24px;margin:0 0 6px;}
  .confirm p{color:var(--ink-soft);font-size:14px;margin:0;}
  .confirm-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px;}

  /* ---------- drawing screen ---------- */
  .draw-shell{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--bg);}
  .db-top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 16px calc(12px);background:var(--surface);
    border-bottom:1px solid var(--line);flex:0 0 auto;
    padding-top:calc(12px + env(safe-area-inset-top));
  }
  .db-top .topic-text{font-family:'Space Grotesk','Inter',sans-serif;font-weight:600;font-size:18px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
  .timer-pill{
    display:inline-block;padding:7px 13px;border-radius:999px;background:var(--surface-2);
    font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;flex:0 0 auto;
    border:1px solid var(--line);
  }
  .timer-pill.low{background:rgba(229,72,77,.12);color:var(--danger);border-color:rgba(229,72,77,.3);}

  .canvas-area{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px;background:var(--surface-2);}
  .canvas-viewport{
    position:relative;flex:0 0 auto;width:280px;height:280px;
    border-radius:16px;overflow:hidden;background:#fff;
    box-shadow:var(--shadow-md);border:1px solid var(--line);
    touch-action:none;
  }
  .canvas-stage{position:absolute;top:0;left:0;width:100%;height:100%;transform-origin:0 0;}
  .canvas-stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;}
  .zoom-pill{
    position:absolute;top:8px;right:8px;pointer-events:none;
    background:rgba(15,23,41,.72);color:#fff;font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:999px;opacity:0;transition:opacity .25s ease;
  }
  .zoom-pill.show{opacity:1;}

  .db-toolbar{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);padding:10px 10px 4px;}
  .tool-row{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none;}
  .tool-row::-webkit-scrollbar{display:none;}
  .tool-row + .tool-row{margin-top:8px;}
  .swatch{
    width:28px;height:28px;border-radius:50%;flex:0 0 auto;cursor:pointer;
    border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(15,23,41,.12);
    transition:transform .12s ease;
  }
  .swatch.active{border-color:var(--accent);transform:scale(1.15);box-shadow:inset 0 0 0 1px rgba(15,23,41,.12), 0 0 0 3px var(--accent-soft);}
  .color-picker-wrap{
    position:relative;width:28px;height:28px;flex:0 0 auto;border-radius:50%;overflow:hidden;
    border:2px solid var(--line);background:conic-gradient(#e5484d,#f5a524,#2f9e68,#3ba3a3,#5b5bd6,#c15a9e,#e5484d);
  }
  .color-picker-wrap input{position:absolute;inset:-6px;width:40px;height:40px;border:none;padding:0;cursor:pointer;opacity:0;}
  .tool-btn{
    flex:0 0 auto;padding:8px 12px;border-radius:10px;background:var(--surface-2);
    font-size:12.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;
    border:1px solid transparent;transition:background .12s ease,color .12s ease;
  }
  .tool-btn:hover{color:var(--ink);}
  .tool-btn.active{background:var(--accent);color:#fff;}
  .tool-btn.disabled{opacity:.4;pointer-events:none;}
  .zoom-btn{min-width:34px;text-align:center;font-size:15px;line-height:1;padding:8px 10px;}
  .size-btn{width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .size-btn span{border-radius:50%;background:var(--ink-soft);display:block;}
  .size-btn.active{background:var(--accent);}
  .size-btn.active span{background:#fff;}
  .divider{width:1px;align-self:stretch;background:var(--line);flex:0 0 auto;margin:2px 4px;}
  .tool-label{
    font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);
    font-weight:700;flex:0 0 auto;
  }
  .recent-swatches{display:flex;gap:8px;align-items:center;}

  .db-bottom{
    display:flex;gap:8px;padding:10px;background:var(--surface);
    border-top:1px solid var(--line);
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
  }
  .db-bottom .field{flex:1;min-width:0;padding:11px 13px;font-size:14px;border-radius:12px;}
  .db-bottom .btn{padding:11px 18px;font-size:14px;white-space:nowrap;}

  /* ---------- voting / results ---------- */
  .vote-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:16px;}
  .vote-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--shadow-sm);text-align:center;position:relative;}
  .vote-card img{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:10px;display:block;background:#fff;}
  .vote-card .who{font-size:13px;font-weight:600;color:var(--ink-soft);margin-top:8px;}
  .vote-card .vote-btn{margin-top:8px;width:100%;padding:9px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:13px;}
  .vote-card .vote-btn:hover:not(:disabled){background:var(--accent-hi);}
  .vote-card .vote-btn:disabled{background:var(--surface-2);color:var(--ink-soft);cursor:default;}
  .vote-card.chosen{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .vote-count{font-size:12px;color:var(--ink-soft);margin-top:6px;font-weight:600;}
  .crown{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:22px;}
  .muted-row{grid-column:1/-1;text-align:center;color:var(--ink-soft);padding:24px 0;font-size:14px;}

  /* ---------- host ---------- */
  .host-wrap{
    padding:26px;min-height:100vh;
    background:
      radial-gradient(900px 600px at 12% -5%, rgba(124,108,240,.32), transparent 60%),
      radial-gradient(800px 500px at 95% 8%, rgba(59,163,163,.2), transparent 55%),
      linear-gradient(165deg,#131a2e 0%,#151327 55%,#0d1120 100%);
    color:#eef1f8;
  }
  .host-top{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start;margin-bottom:26px;}
  .glass{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.11);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  }
  .qr-box{padding:18px;text-align:center;flex:0 0 auto;}
  .qr-box .eyebrow{color:rgba(238,241,248,.6);margin-bottom:10px;}
  #qrcode{
    display:flex;justify-content:center;background:#fff;padding:10px;border-radius:12px;
    max-width:168px;margin:0 auto;color:#0f1729;font-size:10px;word-break:break-all;
  }
  #qrcode img, #qrcode canvas{display:block;}
  .qr-box .hint{font-size:12px;color:rgba(238,241,248,.55);margin-top:10px;max-width:170px;line-height:1.45;}
  .join-hint{font-size:12px;color:rgba(238,241,248,.55);margin-top:10px;max-width:180px;line-height:1.5;text-align:center;}
  .join-or{font-size:11px;color:rgba(238,241,248,.45);}
  .join-where{font-size:12.5px;color:rgba(238,241,248,.8);word-break:break-all;margin:2px 0 4px;font-weight:500;}
  .join-code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;font-weight:700;
    letter-spacing:.14em;color:#fff;margin-top:3px;
  }

  .landing-mark{font-size:40px;line-height:1;margin-bottom:6px;}
  .join-card{position:relative;}
  .landing-signin{position:absolute;top:14px;right:14px;font-size:13px;padding:7px 12px;}
  .landing-welcome{
    text-align:left;background:var(--accent-soft);border:1px solid var(--line);
    border-radius:14px;padding:14px 16px;margin:20px 0 4px;
  }
  .landing-welcome .landing-hint{margin-bottom:0;overflow:hidden;text-overflow:ellipsis;}
  .landing-welcome .landing-go{margin-top:10px;}
  .landing-help{width:100%;margin-top:20px;font-size:13.5px;}
  .picker-note{font-size:12.5px;color:var(--ink-soft);margin:14px 0 0;line-height:1.5;}
  .board-item-code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;
    color:var(--ink);background:var(--surface);border:1px solid var(--line);
    padding:1px 7px;border-radius:6px;letter-spacing:.06em;margin-right:8px;
  }

  .allowance-bar{
    border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:14px;
    background:rgba(245,165,36,.15);color:#8a5c0f;border:1px solid rgba(245,165,36,.35);
  }
  .allowance-bar.bad{background:rgba(229,72,77,.12);color:var(--danger);border-color:rgba(229,72,77,.35);}
  .host-wrap .allowance-bar{background:rgba(245,165,36,.16);color:#f7c46c;border-color:rgba(245,165,36,.32);}
  .host-wrap .allowance-bar.bad{background:rgba(229,72,77,.16);color:#ff9b97;border-color:rgba(229,72,77,.35);}
  .allowance-summary{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;}
  .settings-now{margin:16px 0 20px;padding:12px 14px;background:var(--surface-2);border-radius:12px;}
  .settings-host{font-weight:600;font-size:14px;margin-top:4px;word-break:break-all;}
  .settings-tag{
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    background:var(--accent);color:#fff;padding:2px 7px;border-radius:999px;margin-left:6px;
  }
  .settings-tag.shared{background:var(--ink-soft);}
  .access-id{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;
    background:var(--surface-2);border:1px solid var(--line);padding:8px 12px;
    border-radius:8px;word-break:break-all;flex:1 1 200px;
  }

  .help-overlay{
    position:fixed;inset:0;z-index:950;display:flex;align-items:center;justify-content:center;
    padding:20px;background:rgba(8,12,25,.62);backdrop-filter:blur(4px);overflow-y:auto;
  }
  .help-card{
    position:relative;background:var(--surface);color:var(--ink);
    border:1px solid var(--line);border-radius:20px;padding:26px;
    max-width:520px;width:100%;box-shadow:var(--shadow-lg);margin:auto;
  }
  .help-card h2{margin:0 0 16px;font-size:22px;}
  .help-close{
    position:absolute;top:14px;right:14px;background:var(--surface-2);color:var(--ink-soft);
    width:30px;height:30px;border-radius:50%;font-size:13px;line-height:1;
  }
  .help-close:hover{background:var(--line);color:var(--ink);}
  .help-section{margin-bottom:20px;}
  .help-section:last-of-type{margin-bottom:0;}
  .help-head{font-weight:700;font-size:15px;margin-bottom:6px;}
  .help-section p{margin:0;color:var(--ink-soft);font-size:13.5px;line-height:1.6;}
  .help-section ol{margin:0;padding-left:20px;color:var(--ink-soft);font-size:13.5px;line-height:1.75;}
  .help-section strong{color:var(--ink);}
  .help-url{background:var(--surface-2);padding:2px 6px;border-radius:5px;font-size:12.5px;word-break:break-all;}
  .help-docs{display:block;text-align:center;margin-top:20px;text-decoration:none;}
  .landing-block{text-align:left;}
  .landing-label{font-weight:700;font-size:15px;margin-bottom:2px;}
  .landing-hint{color:var(--ink-soft);font-size:13.5px;margin:0 0 12px;line-height:1.5;}
  .landing-go{width:100%;margin-top:12px;}
  .landing-split{
    display:flex;align-items:center;gap:12px;margin:22px 0;
    color:var(--ink-soft);font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;
  }
  .landing-split::before,.landing-split::after{content:"";flex:1;height:1px;background:var(--line);}
  .join-card{text-align:center;}
  .join-card h2{margin-bottom:6px;}
  .join-input{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:30px;letter-spacing:.22em;text-align:center;text-transform:uppercase;
    margin-top:18px;padding:16px 12px;
  }

  .control-panel{padding:20px 22px;}
  .control-panel .eyebrow{color:rgba(238,241,248,.6);}
  .control-panel .field{
    background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:#fff;
    margin-top:8px;font-size:17px;font-family:'Space Grotesk','Inter',sans-serif;
  }
  .control-panel .field:focus{border-color:var(--accent-hi);box-shadow:0 0 0 3px rgba(124,108,240,.25);}
  .control-panel .field::placeholder{color:rgba(238,241,248,.4);}
  .control-panel .btn.secondary{background:rgba(255,255,255,.09);color:#eef1f8;border-color:rgba(255,255,255,.16);box-shadow:none;}
  .control-panel .btn.secondary:hover{background:rgba(255,255,255,.16);}
  .control-panel .btn.ghost{color:rgba(238,241,248,.7);}
  .control-panel .btn.ghost:hover{background:rgba(255,255,255,.1);color:#fff;}
  .control-panel input[type=number]{
    width:66px;padding:8px 10px;border-radius:10px;font-size:14px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#fff;
  }
  .control-row{display:flex;gap:9px;margin-top:12px;align-items:center;flex-wrap:wrap;}
  .control-row .lbl{font-size:13px;color:rgba(238,241,248,.7);font-weight:500;}
  .save-hint{font-size:12px;font-weight:600;min-height:16px;margin-top:6px;color:var(--warn);}
  .save-hint.saved{color:#63d69c;}
  .phase-row{
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);
  }
  .phase-badge{display:inline-block;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;}
  .phase-badge.drawing{background:rgba(99,214,156,.16);color:#7fe3ac;}
  .phase-badge.voting{background:rgba(245,165,36,.16);color:#f7c46c;}
  .phase-badge.results{background:rgba(124,108,240,.2);color:#b3a7ff;}
  .host-timer{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;margin-left:10px;font-family:'Space Grotesk','Inter',sans-serif;}
  .data-note{
    margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }

  .sec-panel{padding:14px 18px;margin-bottom:22px;}
  .sec-panel summary{
    list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    font-size:13px;color:rgba(238,241,248,.75);
  }
  .sec-panel summary::-webkit-details-marker{display:none;}
  .sec-chip{
    display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;
    background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);
  }
  .sec-chip:empty{display:none;}
  .sec-chip.ok{background:rgba(99,214,156,.14);color:#7fe3ac;border-color:rgba(99,214,156,.3);}
  .sec-chip.warn{background:rgba(245,165,36,.15);color:#f7c46c;border-color:rgba(245,165,36,.32);}
  .sec-more{margin-left:auto;font-weight:600;color:rgba(238,241,248,.55);}
  .sec-body{margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);}
  .sec-lead{font-size:13.5px;line-height:1.6;color:rgba(238,241,248,.75);margin:0 0 12px;max-width:76ch;}

<body>
<div id="app"></div>

<script>
(function(){
  /* ===================== DEPLOYMENT CONFIG =====================
     Fill these two in once and everyone who uses your copy needs no Firebase
     project, no API key and no setup — they just sign in and make a board.
     It also shortens every link, because these stop travelling in the URL.

       dbUrl  — Realtime Database URL   (Firebase → Realtime Database)
       apiKey — Web API key, "AIza…"    (Project settings → General → Your apps)

     Both values are public by design: they ship in the source of every Firebase
     web app and identify the project without granting any access. The database
     rules in firebase-rules.json are what actually protect the data.

     Leave them blank to keep the old behaviour, where each host supplies their
     own ?db=…&key=… in the URL. A value in the URL always wins over these.
     ============================================================ */
  const BUILT_IN = {
    dbUrl:  '',
    apiKey: '',
    /* Optional: a link to the guide, shown from the in-app help. */
    docsUrl: ''
  };

  const params = new URLSearchParams(window.location.search);
  const isHost = params.get('host') === '1';

  /* Board codes are short and typed by humans, so accept any case. Older
     long-form ids are left exactly as they are. */
  const rawBoard = (params.get('b') || '').trim();
  const boardId = rawBoard.length && rawBoard.length <= 8 ? rawBoard.toUpperCase() : rawBoard;

  /* Someone can point this copy at their own Firebase from Settings; it is kept
     on their device only. A URL parameter still wins, for one-off links. */
  const BACKEND_KEY = 'drawTopicBackend';
  function savedBackend(){
    try{ return JSON.parse(localStorage.getItem(BACKEND_KEY) || 'null') || null; }
    catch(e){ return null; }
  }
  function saveBackend(cfg){
    try{
      if(cfg) localStorage.setItem(BACKEND_KEY, JSON.stringify(cfg));
      else localStorage.removeItem(BACKEND_KEY);
      return true;
    }catch(e){ return false; }
  }
  const backend = savedBackend();
  /* A plain board link (?b=CODE, no host=1, no explicit db=) always means the
     shared backend - that is the entire point of short codes. Without this
     guard, a device that had ever set up its own Firebase in Settings would
     try to look up every board code it ever opens inside that project instead
     of the shared one, and simply never find anything. Second-screen links
     (?screen=1) are exempt: that route is only ever opened by the host, on
     the host's own device, to put a second window on the projector - never
     handed to a guest - so it should keep following whatever backend this
     browser is already using. */
  const joiningPlainLink = !!boardId && !isHost && params.get('screen') !== '1' && !params.get('db');
  const usingOwnBackend = !!(backend && backend.dbUrl && !params.get('db') && !joiningPlainLink);
  /* A database address with no scheme is a *relative* path to the browser, so
     every request silently goes to whatever host is serving this page and
     404s. Firebase only speaks https, so assume it rather than fail in a way
     that looks like sign-in being broken. */
  function withScheme(u){
    if(!u) return '';
    return /^https?:\/\//i.test(u) ? u : 'https://' + String(u).replace(/^\/+/, '');
  }
  const dbUrl = withScheme(params.get('db') || (!joiningPlainLink && backend && backend.dbUrl) || BUILT_IN.dbUrl || '');
  const apiKey = params.get('key') || (!joiningPlainLink && backend && backend.apiKey) || BUILT_IN.apiKey || '';
  /* Trials, codes and the host allowlist belong to the copy this page was
     deployed as. On somebody else's database none of it applies, so none of it
     should be asked about either. */
  const onSharedBackend = !usingOwnBackend && !params.get('db');

  const app = document.getElementById('app');
  const POLL_MS = 4000;

  /* Every presenter gets their own board. Links made before boards existed
     have no id and keep using the original top-level paths. */
  function bp(path){ return boardId ? 'boards/' + boardId + '/' + path : path; }

  /* The host holds the door open in slices while the board is on screen, so an
     old QR code is dead a short while after the presentation ends. */
  const SESSION_WINDOW_MS = 30*60000;
  const HEARTBEAT_MS = 5*60000;

  /* Fixed drawing resolution. The backing store is NEVER resized after creation,
     so an iOS URL-bar collapse or keyboard opening can't rescale (squash) artwork. */
  const CANVAS_SIZE = 1200;
  const EXPORT_SIZE = 800;
  const EXPORT_QUALITY = 0.72;

  function esc(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function showToast(msg){
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 4000);
  }

  function participantUrl(){
    const url = new URL(window.location.href);
    url.searchParams.delete('host');
    /* Never hand a guest the screen=1 view by accident - this is called from
       the standalone second-screen route too, whose own address carries it. */
    url.searchParams.delete('screen');
    /* A board on a personal backend needs db/key spelled out: a bare code
       now always resolves to the shared one (see joiningPlainLink above), so
       without this a guest link for an own-backend board would send every
       guest looking in the wrong project. */
    if(usingOwnBackend){
      url.searchParams.set('db', dbUrl);
      url.searchParams.set('key', apiKey);
    }
    return url.toString();
  }
  function hashCode(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h<<5)-h+str.charCodeAt(i); h|=0; } return h; }
  function fmtTime(ms){
    if(ms < 0) ms = 0;
    const s = Math.floor(ms/1000);
    return Math.floor(s/60) + ':' + String(s % 60).padStart(2,'0');
  }

  /* ---------- anonymous sign-in (Identity Toolkit REST, no SDK) ----------
     Every guest silently gets a Firebase identity when they open the QR link.
     It proves the write came from a real client of this project; the session
     window below is what decides *when* those clients are allowed to write. */
  const AUTH_ENABLED = !!apiKey;
  const LS_KEY = 'drawTopicAuth:' + (apiKey || '');
  const auth = { idToken:null, refreshToken:null, uid:null, email:null, isAnon:true, expiresAt:0, error:null };

  function storeAuth(){
    try{
      localStorage.setItem(LS_KEY, JSON.stringify({
        refreshToken:auth.refreshToken, uid:auth.uid, email:auth.email, isAnon:auth.isAnon
      }));
    }catch(e){}
  }
  function clearAuth(){
    auth.idToken = null; auth.refreshToken = null; auth.uid = null;
    auth.email = null; auth.isAnon = true; auth.expiresAt = 0; auth.error = null;
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
  }
  (function loadStoredAuth(){
    if(!AUTH_ENABLED) return;
    try{
      const raw = localStorage.getItem(LS_KEY);
      if(raw){
        const o = JSON.parse(raw);
        auth.refreshToken = o.refreshToken || null;
        auth.uid = o.uid || null;
        auth.email = o.email || null;
        auth.isAnon = o.isAnon !== false;
      }
    }catch(e){}
  })();

  async function idpCall(method, payload){
    const res = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:' + method + '?key=' + encodeURIComponent(apiKey), {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
    });
    const data = await res.json().catch(()=>({}));
    return { ok: res.ok, data };
  }
  function applyIdpSession(data, isAnon){
    auth.idToken = data.idToken; auth.refreshToken = data.refreshToken; auth.uid = data.localId;
    auth.email = data.email || null; auth.isAnon = isAnon;
    auth.expiresAt = Date.now() + (parseInt(data.expiresIn,10) || 3600) * 1000;
    auth.error = null; storeAuth();
  }

  async function signInAnonymously(){
    try{
      const { ok, data } = await idpCall('signUp', { returnSecureToken:true });
      if(!ok){ auth.error = (data.error && data.error.message) || 'SIGN_IN_FAILED'; return false; }
      applyIdpSession(data, true);
      return true;
    }catch(e){ auth.error = 'NETWORK'; return false; }
  }

  /* Hosts use a real account, so their identity — and the boards they own —
     follow them to any device instead of living in one browser. */
  async function signInWithPassword(email, password, isNewAccount){
    try{
      const { ok, data } = await idpCall(isNewAccount ? 'signUp' : 'signInWithPassword',
        { email, password, returnSecureToken:true });
      if(!ok) return { ok:false, code:(data.error && data.error.message) || 'SIGN_IN_FAILED' };
      applyIdpSession(data, false);
      return { ok:true };
    }catch(e){ return { ok:false, code:'NETWORK' }; }
  }

  async function sendPasswordReset(email){
    try{
      const { ok, data } = await idpCall('sendOobCode', { requestType:'PASSWORD_RESET', email });
      return { ok, code:(data.error && data.error.message) || '' };
    }catch(e){ return { ok:false, code:'NETWORK' }; }
  }

  async function refreshIdToken(){
    if(!auth.refreshToken) return false;
    try{
      const res = await fetch('https://securetoken.googleapis.com/v1/token?key=' + encodeURIComponent(apiKey), {
        method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body: new URLSearchParams({ grant_type:'refresh_token', refresh_token: auth.refreshToken })
      });
      const data = await res.json().catch(()=>({}));
      if(!res.ok){ auth.refreshToken = null; return false; }
      auth.idToken = data.id_token; auth.refreshToken = data.refresh_token; auth.uid = data.user_id;
      auth.expiresAt = Date.now() + (parseInt(data.expires_in,10) || 3600) * 1000;
      auth.error = null; storeAuth(); return true;
    }catch(e){ return false; }
  }

  let authPromise = null;
  async function getIdToken(){
    if(!AUTH_ENABLED) return null;
    if(auth.idToken && Date.now() < auth.expiresAt - 300000) return auth.idToken;
    if(!authPromise){
      /* Guests are signed in silently; hosts are never auto-signed-in, so the
         board can ask them for their account instead. */
      authPromise = (async ()=>{
        if(await refreshIdToken()) return;
        if(!isHost) await signInAnonymously();
      })().finally(()=>{ authPromise = null; });
    }
    await authPromise;
    return auth.idToken;
  }

  function isSignedInHost(){ return !!(auth.idToken && !auth.isAnon); }

  /* ---------- Firebase Realtime Database storage layer ---------- */
  let readDenied = false;    /* rules refused the last read (session closed) */
  let writeDenied = false;
  let serverSkew = 0;        /* rules compare against server time, not ours */

  function serverNow(){ return Date.now() + serverSkew; }
  let serverSkewSet = false;
  function noteServerTime(res){
    const d = res.headers.get('date');
    if(!d) return;
    const t = Date.parse(d);
    if(isNaN(t)) return;
    const measured = t - Date.now();
    /* Date headers only carry whole seconds, so re-measuring constantly makes
       the offset wobble and the countdown stutter. Take it once, and only
       revisit it if the clock genuinely moves (sleep, manual change). */
    if(!serverSkewSet || Math.abs(measured - serverSkew) > 5000){
      serverSkew = measured;
      serverSkewSet = true;
    }
  }
  function isDenied(res){ return res.status === 401 || res.status === 403; }

  async function nodeUrl(path, extra){
    const base = dbUrl.replace(/\/$/, '') + '/' + path + '.json';
    const q = new URLSearchParams();
    const token = await getIdToken();
    if(token) q.set('auth', token);
    if(extra) Object.keys(extra).forEach(k=> q.set(k, extra[k]));
    const qs = q.toString();
    return qs ? base + '?' + qs : base;
  }

  /* Keys only, no values — a few bytes per drawing instead of the whole image. */
  async function dbGetShallow(path){
    try{
      const res = await fetch(await nodeUrl(path, { shallow:'true' }));
      noteServerTime(res);
      if(isDenied(res)){ readDenied = true; return {}; }
      readDenied = false;
      if(!res.ok) return {};
      const data = await res.json();
      return data || {};
    }catch(e){ return {}; }
  }

  async function dbGet(path){
    try{
      const res = await fetch(await nodeUrl(path));
      noteServerTime(res);
      if(isDenied(res)){ readDenied = true; return {}; }
      readDenied = false;
      if(!res.ok) return {};
      const data = await res.json();
      return data || {};
    }catch(e){ return {}; }
  }
  async function dbWrite(method, path, dataObj){
    try{
      const res = await fetch(await nodeUrl(path), {
        method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(dataObj)
      });
      noteServerTime(res);
      writeDenied = isDenied(res);
      return res.ok;
    }catch(e){ return false; }
  }
  async function dbPatch(path, dataObj){ return dbWrite('PATCH', path, dataObj); }
  /* One write, several paths. The rules require a quota counter to move in the
     same update as the thing it counts, which is only possible atomically. */
  async function dbUpdate(paths){ return dbWrite('PATCH', '', paths); }
  async function dbPut(path, dataObj){ return dbWrite('PUT', path, dataObj); }
  async function dbDelete(path){
    try{
      const res = await fetch(await nodeUrl(path), { method:'DELETE' });
      noteServerTime(res);
      writeDenied = isDenied(res);
      return res.ok;
    }catch(e){ return false; }
  }

  /* ---------- session window (host-controlled write gate) ---------- */
  async function openSessionWindow(){ return dbPut(bp('session/openUntil'), serverNow() + SESSION_WINDOW_MS); }
  async function closeSessionWindow(){ return dbPut(bp('session/openUntil'), 0); }
  async function getSessionOpenUntil(){
    const v = await dbGet(bp('session/openUntil'));
    return typeof v === 'number' ? v : 0;
  }

  /* ---------- allowance ----------
     Unlimited accounts are listed under /hosts. Everyone else claims a code,
     which grants a week and a fixed number of boards and drawings. Counters
     live in the data because rules cannot count. */
  const WEEK_MS = 7*24*60*60*1000;
  let myGrant = null;           /* null = none, or the grant object */
  let iAmUnlimited = false;

  async function loadAllowance(){
    if(!auth.uid){ myGrant = null; iAmUnlimited = false; return; }
    const [unlimited, grant] = await Promise.all([
      dbGet('hosts/' + auth.uid),
      dbGet('grants/' + auth.uid)
    ]);
    iAmUnlimited = unlimited === true;
    myGrant = (grant && grant.expiresAt) ? grant : null;
    return myGrant;
  }
  /* Whether this deployment restricts hosting at all. /hosts itself is not
     readable — hostingGate holds nothing and exists only so that reading it
     succeeds exactly when /hosts has entries, which answers the question
     without exposing who is on the list. */
  let hostingGateCache = null;
  async function isHostingGated(){
    if(!onSharedBackend) return false;
    if(hostingGateCache !== null) return hostingGateCache;
    try{
      const res = await fetch(await nodeUrl('hostingGate'));
      noteServerTime(res);
      hostingGateCache = !isDenied(res);
    }catch(e){ hostingGateCache = false; }
    return hostingGateCache;
  }

  function grantLive(g){ return !!(g && g.expiresAt > serverNow()); }
  function boardsLeft(g){ return g ? Math.max(0, (g.boardsMax || 0) - (g.boardsUsed || 0)) : 0; }
  function imagesLeft(g){ return g ? Math.max(0, (g.imagesMax || 0) - (g.imagesUsed || 0)) : 0; }
  function daysLeft(g){ return g ? Math.max(0, Math.ceil((g.expiresAt - serverNow()) / 86400000)) : 0; }

  /* Claim a code: take the code and create the allowance in one write, so a
     grant can never exist without a code behind it. */
  async function claimCode(rawCode){
    const code = String(rawCode || '').trim().toUpperCase();
    if(!code) return { ok:false, reason:'empty' };
    const now = serverNow();
    const ok = await dbUpdate({
      ['codes/' + code + '/claimedBy']: auth.uid,
      ['codes/' + code + '/claimedAt']: now,
      ['grants/' + auth.uid]: {
        code, expiresAt: now + WEEK_MS,
        boardsUsed: 0, boardsMax: 6,
        imagesUsed: 0, imagesMax: 90
      }
    });
    if(!ok) return { ok:false, reason:'refused' };
    await loadAllowance();
    return { ok:true };
  }

  /* ---------- boards: one per presenter, so several people can run their own
     night off the same deployment without touching each other's drawings ---- */
  /* Short enough to read off a slide, and no characters that get misread:
     no 0/O, no 1/I/L. 31^6 ≈ 887 million combinations. */
  const CODE_ALPHABET = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
  const CODE_LENGTH = 6;
  function newBoardCode(){
    let out = '';
    const buf = new Uint32Array(CODE_LENGTH);
    (window.crypto || window.msCrypto).getRandomValues(buf);
    for(let i=0;i<CODE_LENGTH;i++) out += CODE_ALPHABET[buf[i] % CODE_ALPHABET.length];
    return out;
  }
  function looksLikeCode(s){
    return new RegExp('^[' + CODE_ALPHABET + ']{' + CODE_LENGTH + '}$').test(String(s || '').toUpperCase());
  }

  async function listMyBoards(){
    if(!auth.uid) return [];
    const obj = await dbGet('users/' + auth.uid + '/boards');
    return Object.keys(obj)
      .map(id=>({ id, ...obj[id] }))
      .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  }
  async function createBoard(name){
    const createdAt = Date.now();
    const clean = (name || '').trim() || 'Untitled board';
    /* Claim a free code. The rules only accept an owner while there isn't one,
       so a collision fails the write and we simply try another code. */
    let id = null;
    for(let attempt = 0; attempt < 6; attempt++){
      const candidate = newBoardCode();
      const existing = await dbGet('boards/' + candidate + '/owner');
      if(existing && typeof existing === 'string') continue;
      /* Claiming the code and spending one of the allowance's boards have to
         happen together, or neither happens. */
      const claim = { ['boards/' + candidate + '/owner']: auth.uid };
      if(!iAmUnlimited && myGrant) claim['grants/' + auth.uid + '/boardsUsed'] = (myGrant.boardsUsed || 0) + 1;
      if(await dbUpdate(claim)){
        id = candidate;
        if(claim['grants/' + auth.uid + '/boardsUsed'] !== undefined) myGrant.boardsUsed = (myGrant.boardsUsed || 0) + 1;
        break;
      }
    }
    if(!id) return null;
    await dbPut('boards/' + id + '/meta', { name: clean, createdAt });
    await dbPut('boards/' + id + '/state', { ...DEFAULT_STATE, round: 'r' + createdAt, roundStartedAt: createdAt });
    await dbPut('users/' + auth.uid + '/boards/' + id, { name: clean, createdAt });
    return id;
  }
  async function deleteBoard(id){
    const ok = await dbDelete('boards/' + id);
    await dbDelete('users/' + auth.uid + '/boards/' + id);
    return ok;
  }
  async function getBoardMeta(){
    if(!boardId) return null;
    const m = await dbGet(bp('meta'));
    return m && m.name ? m : null;
  }
  function boardUrl(id){
    const url = new URL(window.location.href);
    url.searchParams.set('host', '1');
    url.searchParams.set('b', id);
    return url.toString();
  }

  function authErrorText(code){
    switch(code){
      case 'EMAIL_EXISTS': return 'That email already has an account — try signing in instead.';
      case 'EMAIL_NOT_FOUND':
      case 'INVALID_PASSWORD':
      case 'INVALID_LOGIN_CREDENTIALS': return 'Email or password not recognised.';
      case 'OPERATION_NOT_ALLOWED': return 'Email sign-in is not enabled for this Firebase project yet.';
      case 'TOO_MANY_ATTEMPTS_TRY_LATER': return 'Too many attempts — wait a minute and try again.';
      case 'MISSING_PASSWORD': return 'Enter a password.';
      case 'INVALID_EMAIL': return 'That does not look like an email address.';
      case 'NETWORK': return 'Could not reach Firebase — check your connection.';
      default:
        if((code||'').startsWith('WEAK_PASSWORD')) return 'Use a password of at least 6 characters.';
        return 'Could not sign in (' + (code || 'unknown error') + ').';
    }
  }

  const DEFAULT_STATE = { topic: '', phase: 'drawing', timerEnd: null, round: 'r0', roundStartedAt: 0 };
  async function getState(){
    const obj = await dbGet(bp('state'));
    if(obj && obj.phase) return { ...DEFAULT_STATE, ...obj };
    return { ...DEFAULT_STATE };
  }
  async function setState(state){ return await dbPut(bp('state'), state); }

  /* Locked down, the vote key is the signed-in uid so the rules can enforce
     one vote per person. Otherwise fall back to a per-tab random id. */
  async function getVoterId(){
    if(AUTH_ENABLED){
      await getIdToken();
      if(auth.uid) return auth.uid;
    }
    let id = window.name && window.name.startsWith('voter:') ? window.name.slice(6) : null;
    if(!id){ id = 'v' + Math.random().toString(36).slice(2,10); window.name = 'voter:' + id; }
    return id;
  }
  function getMyVoteKey(round){ return 'myvote_' + round; }
  function getMyVote(round){ return window[getMyVoteKey(round)] || null; }
  function setMyVote(round, submissionKey){ window[getMyVoteKey(round)] = submissionKey; }

  /* An entry belongs to the current round only if it is tagged with this round,
     or (for entries written before round tagging) was created after it started. */
  function isCurrentRound(item, state){
    if(!state) return true;
    if(item && item.round) return item.round === state.round;
    if(state.roundStartedAt) return (item && item.ts || 0) >= state.roundStartedAt;
    return true;
  }

  /* A submitted drawing is immutable — the rules refuse any overwrite — so it
     only ever needs downloading once. Each poll asks for the key list and
     fetches just the drawings it has not seen, instead of re-downloading every
     image on every tick. */
  const boardCache = new Map();
  function resetBoardCache(){ boardCache.clear(); }

  async function fetchBoard(state){
    const keys = await dbGetShallow(bp('board'));
    if(readDenied) return [];

    for(const k of [...boardCache.keys()]){
      if(!keys[k]) boardCache.delete(k);            /* cleared or wiped remotely */
    }
    const missing = Object.keys(keys).filter(k=>!boardCache.has(k));
    for(const k of missing){
      const rec = await dbGet(bp('board/' + k));
      if(rec && rec.dataUrl) boardCache.set(k, rec);
    }

    return [...boardCache.entries()]
      .map(([key, v])=>({ key, ...v }))
      .filter(i=>isCurrentRound(i, state))
      .sort((a,b)=>(b.ts||0)-(a.ts||0));
  }

  /* Cheap fingerprint of what a board view is showing, so an unchanged board
     does not rebuild its markup (and re-decode every image) every 4 seconds. */
  function viewSignature(items, counts, extra){
    return items.map(i=>i.key).join(',') + '|'
         + items.map(i=>(counts && counts[i.key]) || 0).join(',') + '|'
         + (extra == null ? '' : extra);
  }
  async function fetchVotes(state){
    const obj = await dbGet(bp('votes'));
    return Object.keys(obj).map(k=>obj[k]).filter(v=>isCurrentRound(v, state));
  }
  function tallyVotes(votes){
    const counts = {};
    votes.forEach(v=>{ if(v && v.choice){ counts[v.choice] = (counts[v.choice]||0) + 1; } });
    return counts;
  }

  /* Remove everything the current round doesn't need. Returns true when the
     database is confirmed clean. */
  async function wipeRoundData(){
    await dbDelete(bp('board'));
    await dbDelete(bp('votes'));
    let board = await dbGet(bp('board'));
    let votes = await dbGet(bp('votes'));
    if(Object.keys(board).length || Object.keys(votes).length){
      await dbDelete(bp('board'));
      await dbDelete(bp('votes'));
      board = await dbGet(bp('board'));
      votes = await dbGet(bp('votes'));
    }
    return Object.keys(board).length === 0 && Object.keys(votes).length === 0;
  }

  /* Safety net: drop any leftovers from previous rounds that survived a failed
     or interrupted wipe, so old drawings never sit in Firebase. */
  async function purgeStaleData(state){
    const stale = [];
    /* Reuse what the board refresh already downloaded rather than pulling
       every image again just to read its round tag. */
    boardCache.forEach((rec, k)=>{ if(!isCurrentRound(rec, state)) stale.push(bp('board/'+k)); });
    const votes = await dbGet(bp('votes'));
    Object.keys(votes).forEach(k=>{ if(!isCurrentRound(votes[k], state)) stale.push(bp('votes/'+k)); });
    for(const path of stale){ await dbDelete(path); }
    return stale.length;
  }

  /* ---------- saving pictures ---------- */
  function downloadDataUrl(dataUrl, filename){
    const a = document.createElement('a');
    a.href = dataUrl; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  }
  function loadImage(src){
    return new Promise((resolve)=>{
      const img = new Image();
      img.onload = ()=>resolve(img);
      img.onerror = ()=>resolve(null);
      img.src = src;
    });
  }
  function safeFilePart(str){
    return String(str || '').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
  }

  /* Just the drawings laid out in a grid — the thing people actually want to
     keep, rather than a screenshot of the whole page. */
  async function composeBoardImage(items, topic){
    const CELL = 420, PAD = 30, GAP = 22, NAME = 46;
    const TITLE = topic ? 96 : 0;
    const cols = Math.max(1, Math.ceil(Math.sqrt(items.length)));
    const rows = Math.ceil(items.length / cols);
    const w = PAD*2 + cols*CELL + (cols-1)*GAP;
    const h = PAD*2 + TITLE + rows*(CELL+NAME) + (rows-1)*GAP;

    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const x = c.getContext('2d');
    x.fillStyle = '#ffffff'; x.fillRect(0,0,w,h);
    x.textAlign = 'center';

    if(topic){
      x.fillStyle = '#0f1729';
      x.font = '700 46px "Space Grotesk", Inter, system-ui, sans-serif';
      x.fillText(topic, w/2, PAD + 56, w - PAD*2);
    }
    for(let i=0;i<items.length;i++){
      const img = await loadImage(items[i].dataUrl);
      const cx = PAD + (i % cols) * (CELL + GAP);
      const cy = PAD + TITLE + Math.floor(i / cols) * (CELL + NAME + GAP);
      x.fillStyle = '#ffffff'; x.fillRect(cx, cy, CELL, CELL);
      if(img) x.drawImage(img, cx, cy, CELL, CELL);
      x.strokeStyle = '#e3e6f0'; x.lineWidth = 2;
      x.strokeRect(cx+1, cy+1, CELL-2, CELL-2);
      x.fillStyle = '#606b85';
      x.font = '600 26px Inter, system-ui, sans-serif';
      x.fillText(items[i].name || 'Anonymous', cx + CELL/2, cy + CELL + 34, CELL);
    }
    return c.toDataURL('image/png');
  }

  /* ================= SHARED SCREEN (the view the room sees) =================
     Everything here is audience-facing: topic, timer, how to join, the drawings
     and the result. No topic box, no phase buttons, no account, no rules — the
     host keeps those on their own screen. Used two ways: as a full-screen
     overlay on the presenting machine, and as its own URL (&screen=1) for a
     second display. */

  function paintQr(el, text, size){
    if(!el) return true;
    if(typeof QRCode === 'undefined'){ el.textContent = text; return false; }
    try{
      el.textContent = '';
      new QRCode(el, { text, width:size, height:size, colorDark:'#0f1729', colorLight:'#ffffff' });
      return true;
    }catch(e){ el.textContent = text; return false; }
  }

  function screenShellMarkup(withExit){

  let lastScreenSignature = null;
  let screenQrDone = false;

  async function paintScreen(state, hidden){
    const wrap = document.getElementById('screenWrap');
    if(!wrap) return;

    const topicEl = document.getElementById('screenTopic');
    const eyebrow = document.getElementById('screenEyebrow');

    const phaseLabel = state.phase === 'voting' ? 'Vote on your phone'
                     : state.phase === 'results' ? 'Results' : 'Topic';
    if(eyebrow.textContent !== phaseLabel) eyebrow.textContent = phaseLabel;
    const topic = state.phase === 'results' ? '🏆 And the winner is…'
                : state.phase === 'voting' ? (state.topic || 'Pick your favourite')
                : topicText(state);
    if(topicEl.textContent !== topic) topicEl.textContent = topic;



    /* Joining only matters while people can still draw. */
    const joinEl = document.getElementById('screenJoin');
    const showJoin = state.phase === 'drawing';
    joinEl.style.display = showJoin ? '' : 'none';
    if(showJoin && !screenQrDone){
      const guestLink = participantUrl();
      screenQrDone = paintQr(document.getElementById('screenQr'), guestLink, 190);
      const codeEl = document.getElementById('screenCode');
      if(usingOwnBackend){
        /* A short code cannot carry which Firebase project to look in, so on
           a personal backend the readable fallback has to be the full link. */
        document.getElementById('screenWhere').textContent = guestLink.replace(/^https?:\/\//, '');
        codeEl.textContent = ''; codeEl.style.display = 'none';
      } else {
        const where = window.location.origin + window.location.pathname;
        document.getElementById('screenWhere').textContent =
          where.replace(/^https?:\/\//, '').replace(/index\.html$/, '');
        codeEl.textContent = looksLikeCode(boardId) ? boardId : '';
        codeEl.style.display = looksLikeCode(boardId) ? '' : 'none';
      }
    }

    const submissions = await fetchBoard(state);
    let counts = {};
    let ordered = submissions;
    if(state.phase === 'voting' || state.phase === 'results'){
      counts = tallyVotes(await fetchVotes(state));
      if(state.phase === 'results'){
        ordered = [...submissions].sort((a,b)=>(counts[b.key]||0)-(counts[a.key]||0));
      }
    }

    const countEl = document.getElementById('screenCount');
    countEl.textContent = submissions.length
      ? submissions.length + (submissions.length === 1 ? ' drawing' : ' drawings')
      : '';

    const grid = document.getElementById('screenGrid');
    const empty = document.getElementById('screenEmpty');
    empty.style.display = submissions.length ? 'none' : '';

    const sig = viewSignature(ordered, counts, state.phase + '|' + (hidden ? 'h' : ''));
    if(sig === lastScreenSignature) return;
    lastScreenSignature = sig;

    const topCount = state.phase === 'results' && ordered.length ? (counts[ordered[0].key] || 0) : -1;
    grid.classList.toggle('drawings-hidden', !!hidden);

    grid.innerHTML = ordered.map(item=>{
      const name = esc(item.name || 'Anonymous');
      const c = counts[item.key] || 0;
      const isWinner = state.phase === 'results' && topCount > 0 && c === topCount;
      const badge = (state.phase === 'voting' || state.phase === 'results')
        ? `<div class="screen-votes">${c}</div>` : '';
      return `
        <div class="screen-card${isWinner ? ' winner' : ''}">
          ${isWinner ? '<div class="screen-crown">👑</div>' : ''}
          <img src="${esc(item.dataUrl)}" alt="Drawing by ${name}">
          ${badge}
          <div class="screen-name">${name}</div>
        </div>`;
    }).join('');

    layoutScreenGrid();
  }

  /* Pick the column count that makes the drawings as large as possible while
     still fitting the space — a projector is wide, so the limit is height. */
  function layoutScreenGrid(){
    const grid = document.getElementById('screenGrid');
    const body = grid && grid.parentElement;
    if(!grid || !body) return;
    const n = grid.children.length;
    if(!n){ grid.style.gridTemplateColumns = ''; return; }

    const gap = parseFloat(getComputedStyle(grid).gap) || 16;
    const nameRow = 30;                      /* name + card padding */
    const w = body.clientWidth;
    const h = body.clientHeight;
    if(w <= 0 || h <= 0) return;

    let bestCols = 1, bestSize = 0;
    for(let cols = 1; cols <= n; cols++){
      const rows = Math.ceil(n / cols);
      const byWidth = (w - gap * (cols - 1)) / cols;
      const byHeight = (h - gap * (rows - 1)) / rows - nameRow;
      const size = Math.min(byWidth, byHeight);
      if(size > bestSize){ bestSize = size; bestCols = cols; }
    }

       makes Settings sticky. Bookmark that address, or let a browser

  async function startHost(){
    /* Test mode has no accounts: one shared board, exactly as before. */
    if(!AUTH_ENABLED){ renderHostView(); return; }
    await getIdToken();
    if(!isSignedInHost()){ renderHostAuth(); return; }

    await loadAllowance();
    if(!iAmUnlimited && myGrant && !grantLive(myGrant)){ renderClaimScreen({ expired:true }); return; }
    /* No allowance at all is only a wall where one is being enforced, so ask
       first. Finding out by way of a refused Create board was the whole
       problem: it reads as a broken sign-in rather than a missing code. */
    if(!iAmUnlimited && !myGrant && await isHostingGated()){ renderClaimScreen(); return; }

    if(!boardId){ renderBoardPicker(); return; }
    renderHostView();
  }

  /* The warnings: a week that lapses mid-event, or an allowance that runs out
     with the room waiting, should never be the first you hear of it. */
  function allowanceNotice(){
    if(iAmUnlimited || !myGrant) return null;
    const days = daysLeft(myGrant), boards = boardsLeft(myGrant), images = imagesLeft(myGrant);
    if(!grantLive(myGrant)) return { level:'bad', text:'Your week has ended — start another to use your boards again.' };
    const parts = [];
    if(days <= 2) parts.push(days <= 1 ? 'ends today' : days + ' days left');
    if(images <= 15) parts.push(images + ' drawing' + (images === 1 ? '' : 's') + ' left');
    if(boards <= 1) parts.push(boards === 0 ? 'no boards left' : '1 board left');
    if(!parts.length) return null;
    return {
      level: (days <= 1 || images <= 5 || boards === 0) ? 'bad' : 'warn',
      text: 'Your week: ' + parts.join(' · ')
    };
  }
  function allowanceSummary(){
    if(iAmUnlimited) return 'Unlimited access';
    if(!myGrant) return '';
    return `${daysLeft(myGrant)}d left · ${boardsLeft(myGrant)}/${myGrant.boardsMax} boards · ${imagesLeft(myGrant)}/${myGrant.imagesMax} drawings`;
  }

    const host = document.getElementById('allowanceBar');
    if(!host) return;
    const n = allowanceNotice();
    host.style.display = n ? '' : 'none';
    if(n){
      host.textContent = n.text;
      host.className = 'allowance-bar ' + n.level;

  /* ================= DRAW VIEW (participant) ================= */
  let drawLastPhase = null;
  let drawLastRound = null;

  function renderDrawShell(){
    app.innerHTML = `<div id="drawInner"></div>`;
  }

  let closedShown = false;
  let lastVoteSignature = null;
  let lastResultsSignature = null;
  let lastHostSignature = null;

  function renderClosedScreen(){
    if(closedShown) return;
    closedShown = true;
    const inner = document.getElementById('drawInner');
    if(!inner) return;
    const why = auth.error === 'OPERATION_NOT_ALLOWED'
      ? 'This board is not quite set up yet — let the host know.'
      : 'The host has not opened this session yet, or it has already finished. Leave this page open — it will spring to life when the board goes up.';
    inner.innerHTML = `
