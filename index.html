<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1729">
<title>Draw the Topic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  :root{
    --bg:#f4f5fa;
    --surface:#ffffff;
    --surface-2:#eef0f7;
    --ink:#0f1729;
    --ink-soft:#606b85;
    --line:#e3e6f0;
    --accent:#5b5bd6;
    --accent-hi:#7c6cf0;
    --accent-soft:#eceafc;
    --danger:#e5484d;
    --warn:#f5a524;
    --ok:#2f9e68;
    --radius:14px;
    --radius-lg:20px;
    --shadow-sm:0 1px 2px rgba(15,23,41,.05), 0 1px 3px rgba(15,23,41,.07);
    --shadow-md:0 6px 20px rgba(15,23,41,.09);
    --shadow-lg:0 20px 50px rgba(8,12,25,.28);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1421; --surface:#171d2c; --surface-2:#111726;
      --ink:#eef1f8; --ink-soft:#98a2ba; --line:#262d40;
      --accent:#7c6cf0; --accent-hi:#9a8dff; --accent-soft:#232041;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
      --shadow-md:0 6px 20px rgba(0,0,0,.45);
    }
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk','Inter',sans-serif;letter-spacing:-.02em;font-weight:600;}
  button,input{font-family:inherit;}
  button{cursor:pointer;border:none;}
  :focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px;}

  .btn{
    padding:11px 20px;border-radius:12px;font-weight:600;font-size:14px;
    background:var(--accent);color:#fff;
    box-shadow:0 1px 2px rgba(15,23,41,.12);
    transition:background .15s ease, transform .1s ease, opacity .15s ease;
  }
  .btn:hover{background:var(--accent-hi);}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  .btn.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-sm);}
  .btn.secondary:hover{background:var(--surface-2);}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid transparent;box-shadow:none;}
  .btn.ghost:hover{background:var(--surface-2);color:var(--ink);}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid rgba(229,72,77,.35);box-shadow:none;}
  .btn.danger:hover{background:rgba(229,72,77,.1);}
  .btn.small{padding:8px 14px;font-size:13px;border-radius:10px;}
  .eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}

  .field{
    width:100%;padding:12px 14px;border-radius:12px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    font-size:15px;transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none;}
  .field::placeholder{color:var(--ink-soft);opacity:.8;}

  /* ---------- setup ---------- */
  .setup-wrap{max-width:560px;margin:0 auto;padding:48px 20px;}
  .setup-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:28px;box-shadow:var(--shadow-md);}
  .setup-card h2{margin:0 0 6px;font-size:24px;}
  .setup-card .sub{color:var(--ink-soft);font-size:14px;margin:0 0 18px;}
  .setup-card ol{padding-left:18px;line-height:1.8;font-size:14px;color:var(--ink-soft);margin:0 0 20px;}
  .setup-card ol strong{color:var(--ink);}
  .setup-card a{color:var(--accent);}
  .setup-card code{background:var(--surface-2);padding:1px 6px;border-radius:5px;font-size:12.5px;}
  .err{color:var(--danger);font-size:13px;margin-top:10px;}

  /* ---------- participant shells ---------- */
  .draw-wrap{max-width:560px;margin:0 auto;padding:24px 16px 40px;}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);text-align:center;margin-bottom:18px;}
  .panel h1{font-size:24px;margin:6px 0 0;}
  .confirm{text-align:center;padding:56px 20px;}
  .confirm .stamp{
    width:64px;height:64px;margin:0 auto 16px;border-radius:20px;
    display:flex;align-items:center;justify-content:center;font-size:30px;
    background:linear-gradient(140deg,var(--accent),var(--accent-hi));
    box-shadow:0 10px 24px rgba(91,91,214,.35);
  }
  .confirm h2{font-size:24px;margin:0 0 6px;}
  .confirm p{color:var(--ink-soft);font-size:14px;margin:0;}

  /* ---------- drawing screen ---------- */
  .draw-shell{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--bg);}
  .db-top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 16px calc(12px);background:var(--surface);
    border-bottom:1px solid var(--line);flex:0 0 auto;
    padding-top:calc(12px + env(safe-area-inset-top));
  }
  .db-top .topic-text{font-family:'Space Grotesk','Inter',sans-serif;font-weight:600;font-size:18px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
  .timer-pill{
    display:inline-block;padding:7px 13px;border-radius:999px;background:var(--surface-2);
    font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;flex:0 0 auto;
    border:1px solid var(--line);
  }
  .timer-pill.low{background:rgba(229,72,77,.12);color:var(--danger);border-color:rgba(229,72,77,.3);}

  .canvas-area{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px;background:var(--surface-2);}
  .canvas-stage{
    position:relative;flex:0 0 auto;width:280px;height:280px;
    border-radius:16px;overflow:hidden;background:#fff;
    box-shadow:var(--shadow-md);border:1px solid var(--line);
  }
  .canvas-stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;}

  .db-toolbar{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);padding:10px 10px 4px;}
  .tool-row{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none;}
  .tool-row::-webkit-scrollbar{display:none;}
  .tool-row + .tool-row{margin-top:8px;}
  .swatch{
    width:28px;height:28px;border-radius:50%;flex:0 0 auto;cursor:pointer;
    border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(15,23,41,.12);
    transition:transform .12s ease;
  }
  .swatch.active{border-color:var(--accent);transform:scale(1.15);box-shadow:inset 0 0 0 1px rgba(15,23,41,.12), 0 0 0 3px var(--accent-soft);}
  .color-picker-wrap{
    position:relative;width:28px;height:28px;flex:0 0 auto;border-radius:50%;overflow:hidden;
    border:2px solid var(--line);background:conic-gradient(#e5484d,#f5a524,#2f9e68,#3ba3a3,#5b5bd6,#c15a9e,#e5484d);
  }
  .color-picker-wrap input{position:absolute;inset:-6px;width:40px;height:40px;border:none;padding:0;cursor:pointer;opacity:0;}
  .tool-btn{
    flex:0 0 auto;padding:8px 12px;border-radius:10px;background:var(--surface-2);
    font-size:12.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;
    border:1px solid transparent;transition:background .12s ease,color .12s ease;
  }
  .tool-btn:hover{color:var(--ink);}
  .tool-btn.active{background:var(--accent);color:#fff;}
  .tool-btn.disabled{opacity:.4;pointer-events:none;}
  .size-btn{width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .size-btn span{border-radius:50%;background:var(--ink-soft);display:block;}
  .size-btn.active{background:var(--accent);}
  .size-btn.active span{background:#fff;}
  .divider{width:1px;align-self:stretch;background:var(--line);flex:0 0 auto;margin:2px 4px;}

  .db-bottom{
    display:flex;gap:8px;padding:10px;background:var(--surface);
    border-top:1px solid var(--line);
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
  }
  .db-bottom .field{flex:1;min-width:0;padding:11px 13px;font-size:14px;border-radius:12px;}
  .db-bottom .btn{padding:11px 18px;font-size:14px;white-space:nowrap;}

  /* ---------- voting / results ---------- */
  .vote-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:16px;}
  .vote-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--shadow-sm);text-align:center;position:relative;}
  .vote-card img{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:10px;display:block;background:#fff;}
  .vote-card .who{font-size:13px;font-weight:600;color:var(--ink-soft);margin-top:8px;}
  .vote-card .vote-btn{margin-top:8px;width:100%;padding:9px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:13px;}
  .vote-card .vote-btn:hover:not(:disabled){background:var(--accent-hi);}
  .vote-card .vote-btn:disabled{background:var(--surface-2);color:var(--ink-soft);cursor:default;}
  .vote-card.chosen{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .vote-count{font-size:12px;color:var(--ink-soft);margin-top:6px;font-weight:600;}
  .crown{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:22px;}
  .muted-row{grid-column:1/-1;text-align:center;color:var(--ink-soft);padding:24px 0;font-size:14px;}

  /* ---------- host ---------- */
  .host-wrap{
    padding:26px;min-height:100vh;
    background:
      radial-gradient(900px 600px at 12% -5%, rgba(124,108,240,.32), transparent 60%),
      radial-gradient(800px 500px at 95% 8%, rgba(59,163,163,.2), transparent 55%),
      linear-gradient(165deg,#131a2e 0%,#151327 55%,#0d1120 100%);
    color:#eef1f8;
  }
  .host-top{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start;margin-bottom:26px;}
  .glass{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.11);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  }
  .qr-box{padding:18px;text-align:center;flex:0 0 auto;}
  .qr-box .eyebrow{color:rgba(238,241,248,.6);margin-bottom:10px;}
  #qrcode{
    display:flex;justify-content:center;background:#fff;padding:10px;border-radius:12px;
    max-width:168px;margin:0 auto;color:#0f1729;font-size:10px;word-break:break-all;
  }
  #qrcode img, #qrcode canvas{display:block;}
  .qr-box .hint{font-size:12px;color:rgba(238,241,248,.55);margin-top:10px;max-width:170px;line-height:1.45;}

  .control-panel{padding:20px 22px;}
  .control-panel .eyebrow{color:rgba(238,241,248,.6);}
  .control-panel .field{
    background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:#fff;
    margin-top:8px;font-size:17px;font-family:'Space Grotesk','Inter',sans-serif;
  }
  .control-panel .field:focus{border-color:var(--accent-hi);box-shadow:0 0 0 3px rgba(124,108,240,.25);}
  .control-panel .field::placeholder{color:rgba(238,241,248,.4);}
  .control-panel .btn.secondary{background:rgba(255,255,255,.09);color:#eef1f8;border-color:rgba(255,255,255,.16);box-shadow:none;}
  .control-panel .btn.secondary:hover{background:rgba(255,255,255,.16);}
  .control-panel .btn.ghost{color:rgba(238,241,248,.7);}
  .control-panel .btn.ghost:hover{background:rgba(255,255,255,.1);color:#fff;}
  .control-panel input[type=number]{
    width:66px;padding:8px 10px;border-radius:10px;font-size:14px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#fff;
  }
  .control-row{display:flex;gap:9px;margin-top:12px;align-items:center;flex-wrap:wrap;}
  .control-row .lbl{font-size:13px;color:rgba(238,241,248,.7);font-weight:500;}
  .save-hint{font-size:12px;font-weight:600;min-height:16px;margin-top:6px;color:var(--warn);}
  .save-hint.saved{color:#63d69c;}
  .phase-row{
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);
  }
  .phase-badge{display:inline-block;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;}
  .phase-badge.drawing{background:rgba(99,214,156,.16);color:#7fe3ac;}
  .phase-badge.voting{background:rgba(245,165,36,.16);color:#f7c46c;}
  .phase-badge.results{background:rgba(124,108,240,.2);color:#b3a7ff;}
  .host-timer{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;margin-left:10px;font-family:'Space Grotesk','Inter',sans-serif;}
  .data-note{
    margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);
    font-size:12px;color:rgba(238,241,248,.55);display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }

  .board-header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 4px 16px;}
  .board-header h1{font-size:22px;margin:0;}
  .board-header .count{font-size:13px;color:rgba(238,241,248,.6);}
  #board{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;padding:0 4px 24px;}
  .pin-card{
    background:var(--surface);border-radius:16px;padding:10px;position:relative;
    box-shadow:0 12px 30px rgba(5,8,20,.35);border:1px solid rgba(255,255,255,.08);
    transition:transform .18s ease;
  }
  .pin-card:hover{transform:translateY(-3px);}
  .pin-card.winner{box-shadow:0 0 0 2px var(--warn), 0 14px 34px rgba(5,8,20,.4);}
  .pin-card img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block;border-radius:10px;background:#fff;}
  .pin-card .who{
    display:flex;align-items:center;gap:7px;margin-top:9px;padding:0 2px;
    font-size:13px;font-weight:600;color:var(--ink-soft);
  }
  .pin-card .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .pin-card .votes-badge{
    position:absolute;top:16px;right:16px;background:rgba(15,23,41,.78);color:#fff;
    font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;backdrop-filter:blur(6px);
  }
  .empty-state{color:rgba(238,241,248,.6);text-align:center;padding:64px 20px;font-size:15px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:#0f1729;color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;
    z-index:999;max-width:90%;text-align:center;box-shadow:var(--shadow-lg);
    border:1px solid rgba(255,255,255,.12);
  }
  @media (max-width:720px){
    .host-wrap{padding:16px;}
    .host-top{grid-template-columns:1fr;}
    .qr-box{display:flex;align-items:center;gap:16px;text-align:left;}
    .qr-box .hint{max-width:none;margin-top:4px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const isHost = params.get('host') === '1';
  const dbUrl = params.get('db');
  const app = document.getElementById('app');
  const POLL_MS = 4000;

  /* Fixed drawing resolution. The backing store is NEVER resized after creation,
     so an iOS URL-bar collapse or keyboard opening can't rescale (squash) artwork. */
  const CANVAS_SIZE = 1200;
  const EXPORT_SIZE = 800;
  const EXPORT_QUALITY = 0.72;

  function esc(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function showToast(msg){
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 4000);
  }

  function participantUrl(){
    const url = new URL(window.location.href);
    url.searchParams.delete('host');
    return url.toString();
  }
  function hashCode(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h<<5)-h+str.charCodeAt(i); h|=0; } return h; }
  function fmtTime(ms){
    if(ms < 0) ms = 0;
    const s = Math.floor(ms/1000);
    return Math.floor(s/60) + ':' + String(s % 60).padStart(2,'0');
  }

  /* ---------- Firebase Realtime Database storage layer ---------- */
  function nodeUrl(path){ return dbUrl.replace(/\/$/, '') + '/' + path + '.json'; }

  async function dbGet(path){
    try{
      const res = await fetch(nodeUrl(path));
      if(!res.ok) return {};
      const data = await res.json();
      return data || {};
    }catch(e){ return {}; }
  }
  async function dbPatch(path, dataObj){
    try{
      const res = await fetch(nodeUrl(path), { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(dataObj) });
      return res.ok;
    }catch(e){ return false; }
  }
  async function dbPut(path, dataObj){
    try{
      const res = await fetch(nodeUrl(path), { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(dataObj) });
      return res.ok;
    }catch(e){ return false; }
  }
  async function dbDelete(path){
    try{ const res = await fetch(nodeUrl(path), { method:'DELETE' }); return res.ok; }catch(e){ return false; }
  }

  const DEFAULT_STATE = { topic: '', phase: 'drawing', timerEnd: null, round: 'r0', roundStartedAt: 0 };
  async function getState(){
    const obj = await dbGet('state');
    if(obj && obj.phase) return { ...DEFAULT_STATE, ...obj };
    return { ...DEFAULT_STATE };
  }
  async function setState(state){ return await dbPut('state', state); }

  function getVoterId(){
    let id = window.name && window.name.startsWith('voter:') ? window.name.slice(6) : null;
    if(!id){ id = 'v' + Math.random().toString(36).slice(2,10); window.name = 'voter:' + id; }
    return id;
  }
  function getMyVoteKey(round){ return 'myvote_' + round; }
  function getMyVote(round){ return window[getMyVoteKey(round)] || null; }
  function setMyVote(round, submissionKey){ window[getMyVoteKey(round)] = submissionKey; }

  /* An entry belongs to the current round only if it is tagged with this round,
     or (for entries written before round tagging) was created after it started. */
  function isCurrentRound(item, state){
    if(!state) return true;
    if(item && item.round) return item.round === state.round;
    if(state.roundStartedAt) return (item && item.ts || 0) >= state.roundStartedAt;
    return true;
  }

  async function fetchBoard(state){
    const obj = await dbGet('board');
    const items = Object.keys(obj).map(k=>({ key:k, ...obj[k] })).filter(i=>isCurrentRound(i, state));
    return items.sort((a,b)=>(b.ts||0)-(a.ts||0));
  }
  async function fetchVotes(state){
    const obj = await dbGet('votes');
    return Object.keys(obj).map(k=>obj[k]).filter(v=>isCurrentRound(v, state));
  }
  function tallyVotes(votes){
    const counts = {};
    votes.forEach(v=>{ if(v && v.choice){ counts[v.choice] = (counts[v.choice]||0) + 1; } });
    return counts;
  }

  /* Remove everything the current round doesn't need. Returns true when the
     database is confirmed clean. */
  async function wipeRoundData(){
    await dbDelete('board');
    await dbDelete('votes');
    let board = await dbGet('board');
    let votes = await dbGet('votes');
    if(Object.keys(board).length || Object.keys(votes).length){
      await dbDelete('board');
      await dbDelete('votes');
      board = await dbGet('board');
      votes = await dbGet('votes');
    }
    return Object.keys(board).length === 0 && Object.keys(votes).length === 0;
  }

  /* Safety net: drop any leftovers from previous rounds that survived a failed
     or interrupted wipe, so old drawings never sit in Firebase. */
  async function purgeStaleData(state){
    const stale = [];
    const board = await dbGet('board');
    Object.keys(board).forEach(k=>{ if(!isCurrentRound(board[k], state)) stale.push('board/'+k); });
    const votes = await dbGet('votes');
    Object.keys(votes).forEach(k=>{ if(!isCurrentRound(votes[k], state)) stale.push('votes/'+k); });
    for(const path of stale){ await dbDelete(path); }
    return stale.length;
  }

  /* ================= SETUP SCREEN ================= */
  function renderSetup(){
    app.innerHTML = `
      <div class="setup-wrap">
        <div class="setup-card">
          <h2>One-time setup</h2>
          <p class="sub">Connect a free Firebase Realtime Database to hold this session's drawings.</p>
          <ol>
            <li>Go to <a href="https://console.firebase.google.com" target="_blank" rel="noopener">console.firebase.google.com</a> and sign in with any Google account.</li>
            <li>Click <strong>Add project</strong>, give it any name, and you can skip Google Analytics.</li>

  /* ================= DRAW VIEW (participant) ================= */
  let drawLastPhase = null;
  let drawLastRound = null;

  function renderDrawShell(){
    app.innerHTML = `<div id="drawInner"></div>`;
  }

  async function drawPollLoop(){
    const state = await getState();
    const roundChanged = state.round !== drawLastRound;
    if(state.phase !== drawLastPhase || roundChanged){
      drawLastPhase = state.phase;
      drawLastRound = state.round;
      if(state.phase === 'drawing') renderDrawingPhase(state);
      else if(state.phase === 'voting') await renderVotingPhase(state);
      else if(state.phase === 'results') await renderResultsPhase(state);
    } else if(state.phase === 'drawing'){
      /* Update in place — re-rendering here would wipe the drawing in progress. */
      updateDrawTimer(state);
      updateDrawTopic(state);
    } else if(state.phase === 'voting'){
      await renderVotingPhase(state);
    } else if(state.phase === 'results'){
      await renderResultsPhase(state);
    }
    setTimeout(drawPollLoop, POLL_MS);
  }

  function topicText(state){ return state.topic || 'Draw whatever comes to mind!'; }

  function updateDrawTopic(state){
    const el = document.querySelector('.topic-text');
    if(el && el.textContent !== topicText(state)) el.textContent = topicText(state);
  }

  function updateDrawTimer(state){
    const el = document.getElementById('drawTimerPill');
    if(!el) return;
    if(!state.timerEnd){ el.style.display = 'none'; return; }
    const remaining = state.timerEnd - Date.now();
    el.style.display = 'inline-block';
    el.textContent = '⏱ ' + fmtTime(remaining);
    el.classList.toggle('low', remaining < 15000);
  }

  function starPath(ctx, cx, cy, outerR, innerR){
    const spikes = 5;
    let rot = Math.PI/2*3;
    const step = Math.PI/spikes;
    ctx.moveTo(cx, cy - outerR);
    for(let i=0;i<spikes;i++){
      let x = cx + Math.cos(rot)*outerR, y = cy + Math.sin(rot)*outerR;
      ctx.lineTo(x,y); rot += step;
      x = cx + Math.cos(rot)*innerR; y = cy + Math.sin(rot)*innerR;
      ctx.lineTo(x,y); rot += step;
    }
    ctx.lineTo(cx, cy - outerR);
    ctx.closePath();
  }

  function drawShape(ctx, mode, x0, y0, x1, y1, color, lineWidth, filled){
    const x = Math.min(x0,x1), y = Math.min(y0,y1), w = Math.abs(x1-x0), h = Math.abs(y1-y0);
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lineWidth;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    if(mode === 'line'){ ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); return; }
    if(mode === 'rect'){ ctx.rect(x,y,w,h); }
    else if(mode === 'circle'){ ctx.ellipse(x+w/2, y+h/2, Math.max(w/2,1), Math.max(h/2,1), 0, 0, Math.PI*2); }
    else if(mode === 'triangle'){ ctx.moveTo(x+w/2,y); ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h); ctx.closePath(); }
    else if(mode === 'star'){ starPath(ctx, x+w/2, y+h/2, Math.max(Math.min(w,h)/2,1), Math.max(Math.min(w,h)/4,1)); }
    if(filled) ctx.fill();
    ctx.stroke();
  }

  function renderDrawingPhase(state){
    const inner = document.getElementById('drawInner');
    inner.innerHTML = `
      <div class="draw-shell">
        <div class="db-top">
          <div style="min-width:0;">
            <span class="eyebrow">Topic</span>
            <div class="topic-text">${esc(topicText(state))}</div>
          </div>
          <div class="timer-pill" id="drawTimerPill" style="display:none;"></div>
        </div>
        <div class="canvas-area" id="canvasArea">
          <div class="canvas-stage" id="canvasStage">
            <canvas id="canvas"></canvas>
            <canvas id="overlay"></canvas>
          </div>
        </div>
        <div class="db-toolbar">
          <div class="tool-row" id="colorRow"></div>
          <div class="tool-row" id="modeRow"></div>
        </div>
        <div class="db-bottom">
          <input id="nameInput" class="field" type="text" maxlength="24" placeholder="Your name (optional)">
          <button class="btn secondary" id="clearBtn">Clear</button>
          <button class="btn" id="submitBtn">Add</button>
        </div>
      </div>
    `;
    updateDrawTimer(state);

    const area = document.getElementById('canvasArea');
    const stage = document.getElementById('canvasStage');
    const canvas = document.getElementById('canvas');
    const overlay = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const octx = overlay.getContext('2d');

    /* Backing store is created once at a fixed size and left alone forever. */
    [canvas, overlay].forEach(c=>{ c.width = CANVAS_SIZE; c.height = CANVAS_SIZE; });
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    /* Only the CSS box changes when the viewport moves — pixels are never rescaled. */
    function layoutStage(){
      const cs = getComputedStyle(area);
      const availW = area.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const availH = area.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      const size = Math.max(80, Math.floor(Math.min(availW, availH)));
      stage.style.width = size + 'px';
      stage.style.height = size + 'px';
    }
    layoutStage();
    window.addEventListener('resize', layoutStage);
    window.addEventListener('orientationchange', layoutStage);
    if(window.visualViewport) window.visualViewport.addEventListener('resize', layoutStage);
    if(window.ResizeObserver) new ResizeObserver(layoutStage).observe(area);

    const colors = ['#0f1729','#ffffff','#e5484d','#f76b15','#f5a524','#ecd94a','#5fae5f','#2f9e68','#3ba3a3','#3b5a8a','#5b5bd6','#c15a9e','#8a5a3c'];
    let currentColor = colors[0];
    const colorRow = document.getElementById('colorRow');
    colors.forEach((c,i)=>{
      const s = document.createElement('button');
      s.type = 'button';
      s.className = 'swatch' + (i===0 ? ' active' : '');
      s.style.background = c;
      s.setAttribute('aria-label', 'Colour ' + c);
      s.addEventListener('click', ()=>{
        currentColor = c;
        [...colorRow.querySelectorAll('.swatch')].forEach(el=>el.classList.remove('active'));
        s.classList.add('active');
        if(currentMode === 'eraser') setMode('pen');
      });
      colorRow.appendChild(s);
    });
    const pickerWrap = document.createElement('div');
    pickerWrap.className = 'color-picker-wrap';
    pickerWrap.innerHTML = `<input type="color" id="customColor" value="#0f1729" aria-label="Custom colour">`;
    colorRow.appendChild(pickerWrap);
    document.getElementById('customColor').addEventListener('input', (e)=>{
      currentColor = e.target.value;
      [...colorRow.querySelectorAll('.swatch')].forEach(el=>el.classList.remove('active'));
      if(currentMode === 'eraser') setMode('pen');
    });

    const modeRow = document.getElementById('modeRow');
    const modes = [
      {id:'pen', label:'✏️ Pen'},
      {id:'eraser', label:'🧽 Eraser'},
      {id:'line', label:'／ Line'},
      {id:'rect', label:'▭ Rect'},
      {id:'circle', label:'◯ Circle'},
      {id:'triangle', label:'△ Triangle'},
      {id:'star', label:'★ Star'}
    ];
    let currentMode = 'pen';
    const modeBtns = {};
    modes.forEach((m,i)=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tool-btn' + (i===0 ? ' active' : '');
      b.textContent = m.label;
      b.addEventListener('click', ()=> setMode(m.id));
      modeBtns[m.id] = b;
      modeRow.appendChild(b);
    });
    modeRow.appendChild(Object.assign(document.createElement('div'), {className:'divider'}));

    let fillMode = false;
    const fillBtn = document.createElement('button');
    fillBtn.type = 'button';
    fillBtn.className = 'tool-btn';
    fillBtn.textContent = '⬛ Fill';
    fillBtn.addEventListener('click', ()=>{ fillMode = !fillMode; fillBtn.classList.toggle('active', fillMode); });
    modeRow.appendChild(fillBtn);
    modeRow.appendChild(Object.assign(document.createElement('div'), {className:'divider'}));

    function setMode(id){
      currentMode = id;
      Object.keys(modeBtns).forEach(k=> modeBtns[k].classList.toggle('active', k === id));
      /* Fill only applies to closed shapes. */
      const fillable = ['rect','circle','triangle','star'].includes(id);
      fillBtn.classList.toggle('disabled', !fillable);
    }
    setMode('pen');

    const sizes = [3,8,18];
    let currentSize = sizes[1];
    sizes.forEach((sz,i)=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'size-btn' + (i===1 ? ' active' : '');
      b.setAttribute('aria-label', 'Brush size ' + sz);
      b.innerHTML = `<span style="width:${Math.round(sz*0.8)}px;height:${Math.round(sz*0.8)}px;"></span>`;
      b.addEventListener('click', ()=>{
        currentSize = sz;
        [...modeRow.querySelectorAll('.size-btn')].forEach(el=>el.classList.remove('active'));
        b.classList.add('active');
      });
      modeRow.appendChild(b);
    });

    /* Canvas pixels are 1200×1200 regardless of how big the stage is on screen. */
    function strokeWidth(){ return currentMode === 'eraser' ? currentSize * 3 : currentSize; }
    function strokeColor(){ return currentMode === 'eraser' ? '#ffffff' : currentColor; }

    let hasDrawn = false;
    let drawing = false, activePointer = null, startX = 0, startY = 0, lastX = 0, lastY = 0;

    function pos(e){
      const rect = overlay.getBoundingClientRect();
      const sx = CANVAS_SIZE / rect.width;
      const sy = CANVAS_SIZE / rect.height;
      return { x:(e.clientX - rect.left) * sx, y:(e.clientY - rect.top) * sy };
    }
    function start(e){
      if(drawing) return;                 /* ignore extra fingers / palm touches */
      e.preventDefault();
      drawing = true; activePointer = e.pointerId; hasDrawn = true;
      const p = pos(e); startX = p.x; startY = p.y; lastX = p.x; lastY = p.y;
      if(overlay.setPointerCapture){ try{ overlay.setPointerCapture(e.pointerId); }catch(err){} }
      if(currentMode === 'pen' || currentMode === 'eraser'){
        /* A tap with no movement should still leave a dot. */
        ctx.strokeStyle = strokeColor(); ctx.lineWidth = strokeWidth();
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 0.01, p.y); ctx.stroke();
      }
    }
    function move(e){
      if(!drawing || e.pointerId !== activePointer) return;
      e.preventDefault();
      const p = pos(e);
      if(currentMode === 'pen' || currentMode === 'eraser'){
        ctx.strokeStyle = strokeColor(); ctx.lineWidth = strokeWidth();
        ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke();
        lastX = p.x; lastY = p.y;
      } else {
        octx.clearRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
        drawShape(octx, currentMode, startX, startY, p.x, p.y, currentColor, currentSize, fillMode);
      }
    }
    function end(e){
      if(!drawing || (e.pointerId != null && e.pointerId !== activePointer)) return;
      if(currentMode !== 'pen' && currentMode !== 'eraser'){
        const p = pos(e);
        drawShape(ctx, currentMode, startX, startY, p.x, p.y, currentColor, currentSize, fillMode);
        octx.clearRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
      }
      drawing = false; activePointer = null;
    }
    overlay.addEventListener('pointerdown', start);
    overlay.addEventListener('pointermove', move);
    overlay.addEventListener('pointerup', end);
    overlay.addEventListener('pointercancel', end);
    overlay.addEventListener('contextmenu', e=>e.preventDefault());

    document.getElementById('clearBtn').addEventListener('click', ()=>{
      if(hasDrawn && !confirm('Clear the whole drawing?')) return;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
      octx.clearRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
      hasDrawn = false;
    });

    /* Downscale before upload — full-resolution base64 would bloat the database. */
    function exportDrawing(){
      const out = document.createElement('canvas');
      out.width = EXPORT_SIZE; out.height = EXPORT_SIZE;
      const octx2 = out.getContext('2d');
      octx2.fillStyle = '#ffffff';
      octx2.fillRect(0,0,EXPORT_SIZE,EXPORT_SIZE);
      octx2.imageSmoothingEnabled = true;
      octx2.imageSmoothingQuality = 'high';
      octx2.drawImage(canvas, 0, 0, EXPORT_SIZE, EXPORT_SIZE);
      return out.toDataURL('image/jpeg', EXPORT_QUALITY);
    }

    document.getElementById('submitBtn').addEventListener('click', async ()=>{
      const btn = document.getElementById('submitBtn');
      if(!hasDrawn){ showToast('Draw something first!'); return; }
      btn.disabled = true; btn.textContent = '…';
      const name = document.getElementById('nameInput').value.trim() || 'Anonymous';
      const latest = await getState();
      const key = 'd' + Date.now() + Math.random().toString(36).slice(2,8);
      const ok = await dbPatch('board', { [key]: { name, dataUrl: exportDrawing(), ts: Date.now(), round: latest.round } });
      if(!ok){ btn.disabled = false; btn.textContent = 'Add'; showToast('Could not save — check your connection and try again.'); return; }
      const inner2 = document.getElementById('drawInner');
      inner2.innerHTML = `
        <div class="draw-wrap">
          <div class="confirm">
            <div class="stamp">✓</div>
            <h2>Added to the board!</h2>
            <p>Your drawing just showed up on the big screen.</p>
            <div style="margin-top:24px;"><button class="btn" id="drawAgain">Draw another</button></div>
          </div>
        </div>`;
      document.getElementById('drawAgain').addEventListener('click', ()=> renderDrawingPhase(state));
    });
  }

  async function renderVotingPhase(state){
    const round = state.round;
    const myVote = getMyVote(round);
    const submissions = await fetchBoard(state);
    const inner = document.getElementById('drawInner');
    if(!inner) return;
    inner.innerHTML = `
      <div class="draw-wrap">
        <div class="panel">
          <div class="eyebrow">Voting is open</div>
          <h1>Pick your favourite</h1>
        </div>

      </div>
    `;

      card.className = 'vote-card' + (myVote === item.key ? ' chosen' : '');

          if(!ok){ showToast('Vote did not save — try again.'); btn.disabled = false; btn.textContent = 'Vote for this'; return; }
          setMyVote(round, item.key);
          renderVotingPhase(state);
        });
      }
      grid.appendChild(card);
    });
  }

  async function renderResultsPhase(state){
    const submissions = await fetchBoard(state);
    const votes = await fetchVotes(state);
    const counts = tallyVotes(votes);
    const ranked = [...submissions].sort((a,b)=>(counts[b.key]||0)-(counts[a.key]||0));
    const topCount = ranked.length ? (counts[ranked[0].key]||0) : 0;
    const inner = document.getElementById('drawInner');
    if(!inner) return;
    inner.innerHTML = `
      <div class="draw-wrap">
        <div class="panel"><div class="eyebrow">Results</div><h1>🏆 Top drawings</h1></div>
        <div class="vote-grid" id="resultsGrid"></div>
      </div>
    `;
    const grid = document.getElementById('resultsGrid');
    if(ranked.length === 0){ grid.innerHTML = '<div class="muted-row">No drawings this round.</div>'; return; }
    ranked.forEach(item=>{
      const c = counts[item.key] || 0;
      const card = document.createElement('div');
      card.className = 'vote-card';
      card.innerHTML = `
        ${c === topCount && topCount > 0 ? '<div class="crown">👑</div>' : ''}

        <div class="who">${esc(item.name)}</div>
        <div class="vote-count">${c} vote${c===1?'':'s'}</div>
      `;
      grid.appendChild(card);
    });
  }

  /* ================= HOST VIEW ================= */
  let topicDirty = false;      /* host is editing — never overwrite from the poll */
  let lastRemoteTopic = null;
  let lastPurgedRound = null;
  let lastPurgeAt = 0;

  /* Purging re-reads the board, so only do it when the round changes (right
     after a wipe) and as a slow background sweep after that. */
  const PURGE_SWEEP_MS = 60000;
  async function maybePurge(state){
    const roundChanged = state.round !== lastPurgedRound;
    if(!roundChanged && Date.now() - lastPurgeAt < PURGE_SWEEP_MS) return;
    lastPurgedRound = state.round;
    lastPurgeAt = Date.now();
    await purgeStaleData(state);
  }

      topicDirty = false; lastRemoteTopic = null;
      btn.disabled = false; btn.textContent = 'Erase all data now';
      showToast(clean ? 'All drawings and votes erased from Firebase.' : 'Some data could not be erased — check your connection.');
    });
    document.getElementById('downloadBtn').addEventListener('click', ()=>{
      html2canvas(document.querySelector('.host-wrap'), {backgroundColor:'#131a2e', scale:2}).then(canvas=>{
        const link = document.createElement('a');
        link.download = 'topic-drawing-board.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(()=>{ showToast('Could not capture the board image — try a regular screenshot instead.'); });
    });

    hostPollLoop();
  }

  async function hostPollLoop(){
    const state = await getState();
    const topicInput = document.getElementById('topicInput');

    /* Never clobber what the host is typing. Only sync the field when it is
       untouched and the topic actually changed on the server. */
    if(topicInput && !topicDirty && document.activeElement !== topicInput){
      const remote = state.topic || '';
      if(remote !== lastRemoteTopic){
        topicInput.value = remote;
        lastRemoteTopic = remote;
      }
    }

    const badge = document.getElementById('phaseBadge');
    badge.textContent = state.phase;
    badge.className = 'phase-badge ' + state.phase;

    const timerEl = document.getElementById('hostTimer');
    if(state.phase === 'drawing' && state.timerEnd){
      const remaining = state.timerEnd - Date.now();
      timerEl.textContent = fmtTime(remaining);
      timerEl.style.color = remaining < 15000 ? 'var(--danger)' : '';
      if(remaining <= 0){
        state.phase = 'voting'; state.timerEnd = null;
        await setState(state);
      }
    } else {
      timerEl.textContent = '';
    }

    await maybePurge(state);
    await refreshHostBoard(state);
    setTimeout(hostPollLoop, POLL_MS);
  }

  async function refreshHostBoard(state){
    const boardEl = document.getElementById('board');
    const emptyEl = document.getElementById('emptyState');
    const countEl = document.getElementById('countText');
    const submissions = await fetchBoard(state);

    if(submissions.length === 0){
      boardEl.innerHTML = ''; emptyEl.style.display = 'block'; countEl.textContent = '0 drawings';
      return;
    }
    emptyEl.style.display = 'none';
    countEl.textContent = submissions.length + (submissions.length===1 ? ' drawing' : ' drawings');

    let counts = {};
    let ordered = submissions;
    if(state.phase === 'voting' || state.phase === 'results'){
      const votes = await fetchVotes(state);
      counts = tallyVotes(votes);
      if(state.phase === 'results'){
        ordered = [...submissions].sort((a,b)=>(counts[b.key]||0)-(counts[a.key]||0));
      }
    }
    const topCount = state.phase === 'results' && ordered.length ? (counts[ordered[0].key]||0) : -1;
    const dotColors = ['#e5484d','#2f9e68','#5b5bd6','#f5a524','#3ba3a3','#c15a9e'];

    boardEl.innerHTML = ordered.map(item=>{
      const h = hashCode(item.key);
      const dot = dotColors[Math.abs(h) % dotColors.length];
      const name = esc(item.name || 'Anonymous');
      const isWinner = state.phase === 'results' && topCount > 0 && (counts[item.key]||0) === topCount;
      const voteBadge = (state.phase === 'voting' || state.phase === 'results') ? `<div class="votes-badge">${counts[item.key]||0} ${(counts[item.key]||0)===1?'vote':'votes'}</div>` : '';
      return `
        <div class="pin-card${isWinner ? ' winner' : ''}">
          <img src="${esc(item.dataUrl)}" alt="Drawing by ${name}">
          ${voteBadge}
          <div class="who"><span class="dot" style="background:${dot};"></span>${name}${isWinner ? ' 👑' : ''}</div>
        </div>
      `;
    }).join('');
  }

  /* ================= ROUTER ================= */
  if(!dbUrl){
    if(isHost){ renderSetup(); }
    else { app.innerHTML = '<div class="setup-wrap"><div class="setup-card"><h2>Ask your host for the QR code</h2><p class="sub">This link is missing its board address.</p></div></div>'; }
  } else if(isHost){
    renderHostView();
  } else {
    renderDrawShell();
    drawPollLoop();
  }
})();
</script>
</body>
</html>
